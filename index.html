<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloque Eterno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: una columna tipo app móvil — marcador, tablero 8x8, bandeja, panel de juego, historial; el balance abre como hoja superpuesta */
:root{
  --bg:#1b2a6b; --bg2:#24378a; --board:#121c4d; --cell:#1a2660; --line:#2c3c86; --sheet:#16215a;
  --fg:#f2f5ff; --muted:#a9b6ea; --gold:#ffcf3f;
  --c-opt:#4fe08a; --c-good:#9fd94a; --c-imp:#ffb547; --c-err:#ff6b6b;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:dark;
}
/* Reset propio: fuera de Claude (GitHub Pages) no hay uno por defecto */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg)) fixed,var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;min-height:100vh}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 32px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.5px;line-height:1}
h1 small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;letter-spacing:.3px}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:0;font-weight:800}
.scores{display:flex;gap:14px;text-align:right}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.score.best b{color:var(--gold)}

#board{position:relative;width:100%;aspect-ratio:1;max-width:100%;background:var(--board);border-radius:12px;padding:6px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:3px;box-shadow:inset 0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.35)}
.c{border-radius:5px;background:var(--cell);position:relative}
.blk{background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),inset 3px 0 0 rgba(255,255,255,.12)}
.c.ghost{background:var(--col);opacity:.45}
/* Vista previa de ruptura: las líneas que se romperían toman el color de la pieza y "respiran" el brillo */
.c.pre{--col:var(--pcol);background:var(--pcol);opacity:1;animation:breathe .9s ease-in-out infinite}
.c.pre.blk,.c.pre.ghost{box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),0 0 8px var(--pcol)}
@keyframes breathe{0%,100%{filter:brightness(1.05)}50%{filter:brightness(.5)}}
.c.hint{box-shadow:inset 0 0 0 2px var(--gold)}
.c.best{outline:2px dashed var(--gold);outline-offset:-3px}
.c.missed{outline:2px dashed var(--c-opt);outline-offset:-3px}
.c.fx{position:absolute;pointer-events:none;z-index:2}
.c.pop{animation:pop .32s ease-out forwards}
body.dragging{touch-action:none;overscroll-behavior:none}
@keyframes pop{0%{transform:scale(1);filter:brightness(1.8)}100%{transform:scale(.2);opacity:0}}
#combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2.2rem;color:var(--gold);
  text-shadow:0 3px 0 #a35a00;pointer-events:none;opacity:0;z-index:3}
#combo.show{animation:cb .9s ease-out}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#fb{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap;
  background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:800;
  display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .2s}
#fb.show{opacity:1}
#fb .tag{color:var(--k)}
#fb .why{color:var(--muted);font-weight:600}

.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:rgba(255,255,255,.06);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:112px;position:relative;touch-action:none;cursor:grab}
.slot .badge{position:absolute;top:6px;right:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.slot.rescued{box-shadow:0 0 0 2px var(--c-imp)}
.slot.rescued .badge{color:var(--c-imp)}
.slot.first{box-shadow:0 0 0 2px var(--gold)}
.slot.first .badge{color:var(--gold)}
.mini{display:grid;gap:2px}
.mini i{display:block;border-radius:3px}
#drag{position:fixed;left:0;top:0;pointer-events:none;display:grid;gap:3px;z-index:20;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#drag i{border-radius:5px;display:block}

.panel{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
label.tg{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer}
select,button,textarea{font:inherit;font-size:.85rem;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select,button{cursor:pointer}
button.primary{background:var(--gold);color:#3a2600;border-color:var(--gold);font-weight:800}
button.ghost{background:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--board);border-radius:10px;padding:3px;gap:3px}
.duel{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center;background:rgba(0,0,0,.18);border-radius:12px;padding:10px 12px}
.duel .mb{width:112px}
.duelside{display:flex;flex-direction:column;gap:3px;min-width:0}
.duelside .fl{font-size:.66rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:800}
.duelside b{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.duelside #duelDiff{font-weight:800;font-size:.85rem}
.lives{color:var(--c-err);letter-spacing:2px}
.lives-top{display:flex;justify-content:center;gap:10px;font-size:1.9rem;line-height:1;margin-block:-4px -2px}
.heart{color:#ff3b4e;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,59,78,.45);transition:opacity .35s,filter .35s,transform .35s}
.heart.off{opacity:.22;filter:grayscale(1);text-shadow:none;transform:scale(.85)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shop{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.boost{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px}
.boost b{font-size:.84rem}
.boost small{font-size:.72rem;color:var(--gold);font-weight:800}
.boost.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.boost:disabled{opacity:.45;cursor:not-allowed}
#nextBox{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.18);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
#nextBox .fl{font-size:.66rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:800}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:6px 12px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--fg)}
.log{font-size:.78rem;color:var(--muted);min-height:1.2em}

/* Historial */
.hist{display:flex;flex-direction:column;gap:12px}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.tag{display:inline-block;font-size:.6rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.tag.hinted{background:rgba(255,207,63,.16);color:var(--gold)}
.tag.unk{background:var(--board);color:var(--muted)}
.delrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.84rem}
.empty{font-size:.85rem;color:var(--muted);line-height:1.5}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.patterns{display:flex;flex-direction:column;gap:6px;font-size:.84rem;line-height:1.45}
.patterns li{list-style:none;padding-left:14px;position:relative}
.patterns li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:2px;background:var(--gold)}
.patterns ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
th{font-size:.64rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:right;font-weight:800;padding:6px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 6px;text-align:right;border-top:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.04)}
.gpill{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:800;background:var(--board)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
#impBox{display:flex;flex-direction:column;gap:8px}
#impBox textarea{width:100%;min-height:80px;font-size:.75rem;user-select:text;-webkit-user-select:text}

/* Balance (hoja superpuesta) */
#sheetWrap{position:fixed;inset:0;z-index:30;background:rgba(5,10,35,.66);display:flex;align-items:flex-end;justify-content:center;
  padding-top:max(24px,env(safe-area-inset-top,0px))}
/* flex-shrink:0 en los hijos: sin eso, con la hoja llena, el navegador achicaba la lista plegable y el texto de abajo se le encimaba */
#sheet>*{flex-shrink:0}
#sheet{background:var(--sheet);width:100%;max-width:480px;max-height:100%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@media (min-width:560px){#sheetWrap{align-items:center} #sheet{border-radius:18px;max-height:92%}}
.bal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bal-date{font-size:.75rem;color:var(--muted)}
.global{display:flex;align-items:flex-end;gap:16px}
.global .big{font-family:var(--display);font-size:3.4rem;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}
.global .lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.global .side{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.global .side b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.delta{font-size:.78rem;font-weight:800}
.delta.up{color:var(--c-opt)} .delta.down{color:var(--c-err)}
.subs{display:grid;grid-template-columns:1fr;gap:9px}
.sub{display:grid;grid-template-columns:132px 1fr 30px;align-items:center;gap:10px;font-size:.82rem}
.sub .bar{height:8px;border-radius:5px;background:var(--board);overflow:hidden}
.sub .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.sub b{text-align:right;font-variant-numeric:tabular-nums}
.sub small{color:var(--muted);font-size:.7rem}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--board)}
.dist i{display:block;height:100%}
.dist-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.dist-l b{color:var(--fg)}
.dist-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--board);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted);line-height:1.3}
.kpi.wide{grid-column:1/-1}
.replay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.replay.one{grid-template-columns:minmax(0,1fr);max-width:220px}
/* Registro jugada a jugada */
details.log>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.log>summary::-webkit-details-marker,details.mv>summary::-webkit-details-marker{display:none}
details.log>summary::before{content:"▸";color:var(--muted);font-size:.8rem}
details.log[open]>summary::before{content:"▾"}
.logtools{margin-top:10px}
.mvlist{display:flex;flex-direction:column;gap:4px;margin-top:10px}
details.mv{background:var(--board);border-radius:8px}
details.mv>summary{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;cursor:pointer;list-style:none;font-size:.82rem}
details.mv>summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mvn,.mvpts{color:var(--muted);font-variant-numeric:tabular-nums}
.mvp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.68rem;font-weight:800;color:var(--k);border:1px solid var(--k);border-radius:999px;padding:1px 8px;white-space:nowrap}
.mvbody{padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px}
.mv .mb{background:var(--sheet)}
.mb i.hit{background:var(--gold);box-shadow:0 0 0 1px #fff inset}
.rb{display:flex;flex-direction:column;gap:6px;min-width:0}
.rb span{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.mb{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--board);padding:4px;border-radius:8px;aspect-ratio:1;max-width:100%}
.mb i{display:block;border-radius:2px;background:var(--cell)}
.mb i.on{background:var(--col)}
.mb i.you{background:var(--c-err);box-shadow:0 0 0 1px #fff inset}
.mb i.opt{background:var(--c-opt);box-shadow:0 0 0 1px #fff inset}
.note{font-size:.84rem;line-height:1.5;color:var(--fg)}
.note em{font-style:normal;color:var(--gold)}
.foot{font-size:.72rem;color:var(--muted);line-height:1.45}
/* Coach */
.coach{display:flex;flex-direction:column;gap:12px}
.focus{background:var(--board);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.focus .fl{font-size:.66rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-weight:800}
.focus .ft{font-family:var(--display);font-weight:400;font-size:1.3rem;color:var(--gold);line-height:1.1}
.tip{font-size:.84rem;line-height:1.5;margin:0}
.rank{display:flex;flex-direction:column;gap:7px}
.rank .sub{grid-template-columns:minmax(0,1fr) 90px 34px}
.rank .sub.on span{color:var(--gold)}
.grad{background:rgba(79,224,138,.12);border:1px solid var(--c-opt);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.45}
.done{font-size:.78rem;color:var(--muted);line-height:1.5;margin:0}
#repBox{width:100%;min-height:90px;font-size:.72rem;user-select:text;-webkit-user-select:text}
.c.warnc{outline:2px solid var(--c-err);outline-offset:-3px}
#fb.warn{border-color:var(--c-err)}
#drillBar{display:flex;flex-direction:column;gap:10px}
.drillres{font-size:.86rem;line-height:1.5;margin:0}
.drillres b{color:var(--k)}
@media (prefers-reduced-motion:reduce){.c.pop,#combo.show,.c.pre{animation:none} .c.pre{filter:brightness(.7)} #fb{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Bloque Eterno<small id="sub">8×8 · nunca te quedás sin jugada</small></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>Puntos</span></div>
      <div class="score best"><b id="best">0</b><span>Récord</span></div>
    </div>
  </header>

  <div class="lives-top" id="livesTop" hidden></div>
  <div id="board"><div id="combo"></div><div id="fb"></div></div>
  <div class="tray" id="tray"></div>
  <div id="nextBox" hidden></div>
  <div class="duel" id="duelBox" hidden>
    <div class="duelside"><span class="fl">Motor · mismas piezas</span><b id="engScore">0</b><span id="duelDiff"></span><span class="foot" id="engInfo"></span></div>
    <div class="mb" id="engBoard" aria-label="Tablero del motor"></div>
  </div>

  <div class="panel">
    <div class="row" id="rowMain">
      <div class="seg" role="group" aria-label="Modo de juego">
        <button type="button" data-mode="eterno" aria-pressed="true">Eterno</button>
        <button type="button" data-mode="tutor" aria-pressed="false">Tutor</button>
        <button type="button" data-mode="duelo" aria-pressed="false">Duelo</button>
        <button type="button" data-mode="survival" aria-pressed="false">Survival</button>
        <button type="button" data-mode="puzzle" aria-pressed="false">Puzzles</button>
      </div>
      <button id="reset" type="button" class="ghost">Nueva partida</button>
    </div>
    <div class="row" id="rowEterno">
      <label class="tg" for="hints"><input type="checkbox" id="hints"> Marcar dónde encaja</label>
      <label class="tg" for="album">Sesión <select id="album"><option value="0">libre</option><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option></select></label>
      <span class="foot" id="albumLeft"></span>
    </div>
    <div class="row" id="rowDuel" hidden>
      <div class="seg" role="group" aria-label="Tipo de duelo"><button type="button" id="dDaily" aria-pressed="true">Desafío del día</button><button type="button" id="dFree" aria-pressed="false">Duelo libre</button></div>
      <span class="foot" id="duelInfo"></span>
    </div>
    <div class="row" id="rowSurv" hidden>
      <div class="shop" role="group" aria-label="Boosters">
        <button type="button" class="boost" data-b="future" title="Ves la próxima tanda durante 3 tandas"><b>Ver el futuro</b><small></small></button>
        <button type="button" class="boost" data-b="hammer" title="Tocá un bloque y se borra todo ese color"><b>Martillo de colores</b><small></small></button>
        <button type="button" class="boost" data-b="mult" title="x2 por 5 jugadas; romper 2+ líneas lo sube hasta x8"><b>Multiplicador</b><small></small></button>
        <button type="button" class="boost" data-b="served" title="El motor te sirve piezas para combos"><b>Piezas servidas</b><small></small></button>
      </div>
      <span class="foot" id="boostInfo"></span>
    </div>
    <div class="row" id="rowPuzzle" hidden>
      <div class="tools"><button type="button" id="pzRetry">Reintentar</button><button type="button" id="pzHint" class="ghost">Pista</button><button type="button" id="pzSkip" class="ghost">Otro puzzle</button></div>
    </div>
    <div class="row" id="rowTutor" hidden>
      <label class="tg" for="live"><input type="checkbox" id="live" checked> Pistas en vivo</label>
      <button id="finish" type="button" class="primary">Terminar y ver balance</button>
    </div>
    <div id="drillBar" hidden>
      <p class="drillres" id="drillTxt"></p>
      <div class="tools"><button type="button" id="drillNext" class="primary" hidden>Siguiente</button><button type="button" id="drillSkip">Saltar</button><button type="button" id="drillExit" class="ghost">Salir de los ejercicios</button></div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="log" id="log">Arrastrá una pieza al tablero.</div>
  </div>

  <section class="panel coach" aria-labelledby="cTitle">
    <div class="hist-head"><h2 id="cTitle">Coach</h2><span class="bal-date" id="cMeta"></span></div>
    <div id="cBody"></div>
    <div class="tools">
      <button type="button" id="drillGo" class="primary">Ejercicios</button>
      <button type="button" id="cNext" class="ghost" hidden>Cambiar foco</button>

<script>
(() => {
// ENGINE START
const N = 8;
// Piezas de la captura (fila, columna). Sin rotación, como en el original.
const SHAPES = [
  {id:'S-v',  name:'S vertical',    col:'#3fcf4e', cells:[[0,1],[1,0],[1,1],[2,0]]},
  {id:'Z-h',  name:'Z horizontal',  col:'#2ec4ea', cells:[[0,0],[0,1],[1,1],[1,2]]},
  {id:'I3-h', name:'Barra de 3',    col:'#ffad1f', cells:[[0,0],[0,1],[0,2]]},
  {id:'diag', name:'Diagonal',      col:'#9b4fe0', cells:[[0,0],[1,1],[2,2]]},
  {id:'J',    name:'J',             col:'#e8333f', cells:[[0,0],[1,0],[1,1],[1,2]]},
  {id:'O2',   name:'Cuadrado 2×2',  col:'#f2552c', cells:[[0,0],[0,1],[1,0],[1,1]]},
  {id:'dot',  name:'Punto',         col:'#ef3b36', cells:[[0,0]]},
  {id:'O3',   name:'Cuadrado 3×3',  col:'#ffc21a', cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]},
  // Fuera del reparto (peso 0); queda en la lista solo para que se vean bien las partidas guardadas
  {id:'T',    name:'T',             col:'#a052e8', cells:[[0,1],[1,0],[1,1],[1,2]]},
  {id:'Z-v',  name:'Z vertical',    col:'#3a6ff0', cells:[[0,0],[1,0],[1,1],[2,1]]},
  {id:'I4-v', name:'Barra de 4',    col:'#e22b3a', cells:[[0,0],[1,0],[2,0],[3,0]]},
  {id:'L',    name:'L',             col:'#3d64ee', cells:[[0,0],[1,0],[2,0],[2,1]]},
  // Va al final para no cambiar el índice de color de partidas guardadas
  {id:'R23',  name:'Rectángulo vertical', col:'#19b9a4', cells:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]]},
  // Piezas nuevas (al final para no cambiar el color de partidas guardadas)
  {id:'C3-tl', name:'Esquina chica ┌',  col:'#ffb21f', cells:[[0,0],[0,1],[1,0]]},
  {id:'C3-tr', name:'Esquina chica ┐',  col:'#ff5c8a', cells:[[0,0],[0,1],[1,1]]},
  {id:'C3-bl', name:'Esquina chica └',  col:'#45d16a', cells:[[0,0],[1,0],[1,1]]},
  {id:'C3-br', name:'Esquina chica ┘',  col:'#3fa7f5', cells:[[0,1],[1,0],[1,1]]},
  {id:'R32',   name:'Rectángulo horizontal', col:'#ef4f7a', cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]]},
  {id:'C5-tl', name:'Esquina grande ┌', col:'#f2416b', cells:[[0,0],[0,1],[0,2],[1,0],[2,0]]},
  {id:'C5-tr', name:'Esquina grande ┐', col:'#ffc83a', cells:[[0,0],[0,1],[0,2],[1,2],[2,2]]},
  {id:'C5-bl', name:'Esquina grande └', col:'#3c8cf0', cells:[[0,0],[1,0],[2,0],[2,1],[2,2]]},
  {id:'C5-br', name:'Esquina grande ┘', col:'#38c96a', cells:[[0,2],[1,2],[2,0],[2,1],[2,2]]},
  {id:'T-r',   name:'T derecha ├',   col:'#a052e8', cells:[[0,0],[1,0],[1,1],[2,0]]},
  {id:'T-l',   name:'T izquierda ┤', col:'#b45cf0', cells:[[0,1],[1,0],[1,1],[2,1]]},
];
SHAPES.forEach((s,k)=>{ s.k=k; s.h=Math.max(...s.cells.map(c=>c[0]))+1; s.w=Math.max(...s.cells.map(c=>c[1]))+1; });
const BY_ID = Object.fromEntries(SHAPES.map(s=>[s.id,s]));
const wOf = s => WEIGHT[s.id] ?? 1;   // ?? y no ||: un peso 0 tiene que valer 0
const DOT = BY_ID['dot'], O3 = BY_ID['O3'];
// Peso de aparición: las piezas chicas no deberían salir tanto, si no el juego es trivial
// 1 = frecuencia normal. El Punto sale muy poco; el rectángulo 2×3 un poco más que una pieza normal.
// Las piezas que no figuran tienen frecuencia normal (1). Punto y Diagonal salen muy poco.
const WEIGHT = {'dot':0.1,'diag':0.3,'O3':0.8,'R23':1.2,'T':0};
// Familias: todas las orientaciones de una forma cuentan como UNA pieza normal.
// El peso de la familia se reparte en partes iguales, así cada orientación sale al azar dentro de ella.
const FAMILIES = {
  'Esquina chica':  {w:1, ids:['C3-tl','C3-tr','C3-bl','C3-br']},
  'Esquina grande': {w:1, ids:['C5-tl','C5-tr','C5-bl','C5-br']},
  'T de costado':   {w:1, ids:['T-r','T-l']},
};
for(const f of Object.values(FAMILIES)) for(const id of f.ids) WEIGHT[id]=f.w/f.ids.length;
// Piezas que pueden salir (reparto, rescates y tandas de emergencia)
const ACTIVE = SHAPES.filter(s=>wOf(s)>0);

// Tablero lógico para el motor: Uint8Array(64), 0 vacío / 1 ocupado
function fits(o,s,r,c){
  if(r<0||c<0||r+s.h>N||c+s.w>N) return false;
  for(const [dr,dc] of s.cells) if(o[(r+dr)*N+c+dc]) return false;
  return true;
}
// Coloca y limpia filas/columnas completas. Devuelve {o, cleared:[índices], n:líneas}
function placeO(o,s,r,c){
  const n=o.slice(); for(const [dr,dc] of s.cells) n[(r+dr)*N+c+dc]=1;
  const clr=new Set(); let k=0;
  for(let i=0;i<N;i++){
    let rf=true, cf=true;
    for(let j=0;j<N;j++){ if(!n[i*N+j]) rf=false; if(!n[j*N+i]) cf=false; }
    if(rf){k++; for(let j=0;j<N;j++) clr.add(i*N+j);}
    if(cf){k++; for(let j=0;j<N;j++) clr.add(j*N+i);}
  }
  clr.forEach(i=>n[i]=0);
  return {o:n, cleared:[...clr], n:k};
}
function anyFit(o,s){ for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++) if(fits(o,s,r,c)) return true; return false; }

// ¿Existe algún orden y ubicación que permita colocar TODAS las piezas? (backtracking con presupuesto)
function solvable(o, pieces, budget={n:60000}){
  if(!pieces.length) return true;
  for(let i=0;i<pieces.length;i++){
    if(i>0 && pieces.slice(0,i).some(p=>p===pieces[i])) continue;
    const s=pieces[i], rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
      if(--budget.n<0) return false;
      if(!fits(o,s,r,c)) continue;
      if(solvable(placeO(o,s,r,c).o, rest, budget)) return true;
    }
  }
  return false;
}

// Bitboards: cada ubicación posible de cada pieza como dos enteros de 32 bits, para chequear rápido si entra
const PL = SHAPES.map(s=>{ const out=[];
  for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){ let lo=0,hi=0;
    for(const [a,b] of s.cells){ const i=(r+a)*N+c+b; if(i<32) lo|=(1<<i); else hi|=(1<<(i-32)); }
    out.push(lo,hi); }
  return out; });
const W_TOT = ACTIVE.reduce((a,s)=>a+wOf(s),0);
// Mirada a futuro: probabilidad de que la PRÓXIMA pieza al azar tenga lugar en el tablero,
// ponderada por la frecuencia real de cada pieza. Un tablero donde casi todo entra vale más.
function pFit(o){
  let lo=0,hi=0; for(let i=0;i<32;i++){ if(o[i]) lo|=(1<<i); if(o[i+32]) hi|=(1<<i); }
  let p=0;
  for(const s of ACTIVE){ const pl=PL[s.k]; for(let j=0;j<pl.length;j+=2){ if(!(pl[j]&lo) && !(pl[j+1]&hi)){ p+=wOf(s); break; } } }
  return p/W_TOT;
}

// ---------- Evaluación (tutor) ----------
// Hueco aislado: celda vacía rodeada por bloques o bordes. Solo entra el Punto.
function holes(o){
  let h=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c; if(o[i]) continue;
    if((r===0||o[i-N]) && (r===N-1||o[i+N]) && (c===0||o[i-1]) && (c===N-1||o[i+1])) h++;
  }
  return h;
}
// Salud del tablero: más alto = mejor. Premia espacio libre, lugar para el 3×3 y que la próxima pieza
// probablemente entre; castiga huecos aislados (casi permanentes: el Punto sale muy poco) y bordes irregulares.
// Calibrado en partidas simuladas con las mismas tandas: con estos pesos, jugar lo que sugiere el motor
// necesita ~17% menos rescates que con la versión anterior y suma un poco más de puntos.
const HW = {empty:0.6, hole:12, trans:0.5, room3:2, pfit:40};
function health(o){
  let empty=0, trans=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c, v=o[i];
    if(!v) empty++;
    if(c<N-1 && v!==o[i+1]) trans++;
    if(r<N-1 && v!==o[i+N]) trans++;
  }
  return empty*HW.empty - holes(o)*HW.hole - trans*HW.trans + (anyFit(o,O3)?HW.room3:0) + pFit(o)*HW.pfit;
}
const LW = 8;      // valor de cada línea limpiada
const DEAD = 40;   // castigo por cada pieza de la tanda que queda sin lugar
const BEAM = 5;    // cuántas continuaciones explora en profundidad

// Igual que bestSeq, pero además devuelve cuántas líneas rompe ese mejor plan y si alguna pieza queda sin lugar
function bestSeqL(o, pieces){
  if(!pieces.length) return {val:health(o), lines:0, dead:0};
  const cands=[], seen=new Set();
  pieces.forEach((s,i)=>{ if(seen.has(s.id)) return; seen.add(s.id);
    const rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){ if(!fits(o,s,r,c)) continue;
      const p=placeO(o,s,r,c); cands.push({o:p.o, n:p.n, rest, q:p.n*LW+health(p.o)}); } });
  if(!cands.length) return {val:health(o)-DEAD*pieces.length, lines:0, dead:pieces.length};
  cands.sort((a,b)=>b.q-a.q);
  let best=null;
  for(const x of cands.slice(0,BEAM)){ const sub=bestSeqL(x.o, x.rest), v=x.n*LW+sub.val;
    if(!best || v>best.val) best={val:v, lines:x.n+sub.lines, dead:sub.dead}; }
  return best;
}
// Mejor resultado alcanzable colocando el resto de la tanda (cualquier orden).
// Solo usa lo que el jugador podía ver: tablero + piezas de la tanda. Nada del futuro.
function bestSeq(o, pieces){
  if(!pieces.length) return health(o);
  const cands=[], seen=new Set();
  pieces.forEach((s,i)=>{
    if(seen.has(s.id)) return; seen.add(s.id);
    const rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
      if(!fits(o,s,r,c)) continue;
      const p=placeO(o,s,r,c);
      cands.push({o:p.o, n:p.n, rest, q:p.n*LW+health(p.o)});
    }
  });
  if(!cands.length) return health(o) - DEAD*pieces.length;
  cands.sort((a,b)=>b.q-a.q);
  let best=-Infinity;
  for(let k=0;k<Math.min(BEAM,cands.length);k++){
    const x=cands[k]; const v=x.n*LW + bestSeq(x.o, x.rest);
    if(v>best) best=v;
  }
  return best;
}
// Analiza el turno: valor de cada (pieza, posición) posible ahora mismo.
// slots: [{i, s}] piezas disponibles en la bandeja.
function analyze(o, slots){
  const per={}, memo={}; let best={val:-Infinity};
  for(const {i,s} of slots){
    if(memo[s.id]){ per[i]=memo[s.id]; }
    else{
      const rest=slots.filter(x=>x.i!==i).map(x=>x.s);
      const table=new Map(); let bp=null, bv=-Infinity;
      for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
        if(!fits(o,s,r,c)) continue;
        const p=placeO(o,s,r,c); const v=p.n*LW + bestSeq(p.o, rest);
        table.set(r*N+c, v); if(v>bv){bv=v; bp=[r,c];}
      }
      per[i]=memo[s.id]={table, bestPos:bp, bestVal:bv};
    }
    if(per[i].bestVal>best.val) best={val:per[i].bestVal, slot:i, pos:per[i].bestPos};
  }
  return {per, best, nSlots:slots.length};
}
// Umbrales de pérdida (diferencia contra la mejor jugada posible)
// Umbrales escalados ×1,6 al sumar la mirada a futuro (la escala de pérdidas se estiró en esa proporción),
// para que las calificaciones sigan siendo comparables con las partidas viejas.
const CUT = {optima:0.5, buena:6.5, imprecisa:16};
function judge(A, i, r, c){
  const e=A.per[i], user=e.table.get(r*N+c);
  const loss=Math.max(0, A.best.val-user), posLoss=Math.max(0, e.bestVal-user), orderLoss=Math.max(0, A.best.val-e.bestVal);
  const cat = loss<=CUT.optima?'optima' : loss<=CUT.buena?'buena' : loss<=CUT.imprecisa?'imprecisa' : 'error';
  // Error de orden: la pérdida viene principalmente de haber elegido esta pieza primero
  const orderErr = A.nSlots>1 && cat!=='optima' && orderLoss>CUT.buena && orderLoss>=posLoss;
  return {loss, posLoss, orderLoss, cat, orderErr, acc:100*Math.exp(-loss/19)};
}
// Causa probable de un error: compara tu tablero resultante con el de la jugada sugerida
const CAUSE = {
  block: {t:'Te trabaste la bandeja',  short:'dejaste piezas de la bandeja sin lugar', tip:'Antes de soltar la primera pieza, mirá cuántos lugares tiene cada una de las tres y arrancá por la que menos tiene. Si una jugada rompe una línea, suele abrirles lugar a las otras.'},
  hole:  {t:'Huecos aislados',        short:'dejaste un hueco',               tip:'Antes de soltar, mirá las celdas vecinas: si una queda encerrada, solo entra el Punto, que casi nunca sale.'},
  no3:   {t:'Sin lugar para el 3×3',  short:'te quedaste sin lugar para el 3×3', tip:'Mantené siempre libre un espacio de 3×3: lo necesitan el cuadrado grande y las esquinas grandes.'},
  frag:  {t:'Espacio fragmentado',    short:'achicaste el espacio útil',       tip:'Juntá los bloques en un sector y dejá el espacio libre en una sola zona grande: ahí entra casi cualquier pieza.'},
  greedy:{t:'Romper líneas a cualquier costo', short:'romper esas líneas te dejó peor', tip:'Una línea no siempre conviene: si el combo deja el tablero roto, elegí la jugada que lo deje parejo.'},
  order: {t:'Orden de las piezas',    short:'convenía empezar por otra pieza', tip:'Mirá las tres piezas antes de mover y empezá por la más difícil de ubicar.'},
  rough: {t:'Bordes irregulares',     short:'dejaste escalones y salientes',   tip:'Apoyá las piezas contra bloques o bordes: los escalones y salientes dejan lugares donde casi nada encaja.'},
  miss:  {t:'Líneas que dejaste pasar', short:'con la bandeja completa rompías más líneas', tip:'Antes de soltar, mirá si con las otras piezas podés cerrar una línea: a veces la primera pieza tiene que prepararla.'},
};
// Irregularidad: cambios lleno/vacío entre celdas vecinas (más = más escalones)
function rough(o){ let t=0; for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const i=r*N+c; if(c<N-1 && o[i]!==o[i+1]) t++; if(r<N-1 && o[i]!==o[i+N]) t++; } return t; }
// restU / restB: las otras piezas de la bandeja después de tu jugada / después de la sugerida.
// Varias reglas miran la bandeja completa, porque el motor juzga así: colocando también el resto.
function causes(before, s, r, c, bs, bpos, orderErr, restU, restB){
  const t=[];
  if(!bs || !bpos){ if(orderErr) t.push('order'); return t; }
  const u=placeO(before,s,r,c), b=placeO(before,bs,bpos[0],bpos[1]);
  const pu=restU ? bestSeqL(u.o,restU) : null, pb=restB ? bestSeqL(b.o,restB) : null;
  if(pu && pb && pu.dead>0 && pb.dead===0) t.push('block');   // primero: es el error que hace perder
  if(orderErr) t.push('order');
  if(holes(u.o)>holes(b.o)) t.push('hole');
  if(!anyFit(u.o,O3) && anyFit(b.o,O3)) t.push('no3');
  if(pFit(u.o) < pFit(b.o)-0.1) t.push('frag');
  if(u.n>b.n) t.push('greedy');

  if(rough(u.o)>=rough(b.o)+4) t.push('rough');
  // Líneas con la bandeja completa (tu jugada + mejor continuación vs plan del motor). Va como causa residual:
  // casi todo error termina en menos líneas, así que solo se nombra cuando no hay un problema de forma del tablero.
  if(!t.length && (pu && pb ? u.n+pu.lines < b.n+pb.lines : u.n<b.n)) t.push('miss');
  return t;
}
// ENGINE END

// ======================================================================
// Estado
// board[i] = índice de pieza (para el color) o null
// ======================================================================
const LS = {state:'be-state-v2', hist:'be-hist-v1', best:'be-best', unclear:'be-unclear', coach:'be-coach', drills:'be-drills', warn:'be-warn', live:'be-live'};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let mode='eterno', board, tray, used, score, lines, sets, rescues, saves, game, analysis=null;
let streak=0, bestStreak=0, colorLines=0, lives=3, X={};   // racha, color, vidas y estado propio de cada modo
let best = +store.get(LS.best) || 0;
let hist = []; try{ hist = JSON.parse(store.get(LS.hist)||'[]'); if(!Array.isArray(hist)) hist=[]; }catch(e){ hist=[]; }
const MIN_MOVES = 10;   // partidas más cortas no se guardan: muy poca muestra para medir algo
const readJSON=(k,def)=>{ try{ const v=JSON.parse(store.get(k)||'null'); return v==null?def:v; }catch(e){ return def; } };
let coach = readJSON(LS.coach, {focus:null, since:null, base:0, done:[], grad:null});
let drills = readJSON(LS.drills, {});   // id → {box, due}: repetición espaciada
let drill = null;                        // sesión de ejercicios en curso

function occ(b){ const o=new Uint8Array(64); for(let i=0;i<64;i++) o[i]=b[i]==null?0:1; return o; }
function pickWeighted(){
  const tot=ACTIVE.reduce((a,s)=>a+wOf(s),0); let x=Math.random()*tot;
  for(const s of ACTIVE){ x-=wOf(s); if(x<=0) return s; } return ACTIVE[0];
}
// Calidad de la mejor jugada inmediata de una pieza (lo usa el modo Eterno para elegir la "pieza justa")
function fitQuality(o,s){
  let q=-1;
  for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
    if(!fits(o,s,r,c)) continue;
    const res=placeO(o,s,r,c); let touch=0;
    for(const [dr,dc] of s.cells){ const R=r+dr,C=c+dc;
      for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){ const y=R+a,x=C+b; if(y<0||x<0||y>=N||x>=N||o[y*N+x]) touch++; } }
    q=Math.max(q, res.n*12 + touch/s.cells.length);
  }
  return q;
}

// ---------- Reparto de piezas ----------
function generateSet(){
  const o=occ(board);
  if(mode==='duelo') return duelNextSet();
  if(mode==='survival') return survivalSet();
  if(mode==='tutor') return [pickWeighted(),pickWeighted(),pickWeighted()];  // tandas reales, como el juego original
  const cands=[];
  for(let t=0;t<120 && cands.length<10;t++){ const set=[pickWeighted(),pickWeighted(),pickWeighted()]; if(solvable(o,set)) cands.push(set); }
  if(!cands.length){
    const set=[];
    for(let k=0;k<3;k++){ const opts=[...ACTIVE].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a)); set.push(opts.find(s=>solvable(o,[...set,s]))||DOT); }
    return set;
  }
  let pick=cands[0], bq=-1;
  for(const set of cands){ const q=set.reduce((a,s)=>a+fitQuality(o,s),0)+Math.random()*4; if(q>bq){bq=q;pick=set;} }
  return pick;
}
// Cambia piezas de la bandeja para que vuelva a haber salida (con la menor intervención posible)
function swapForExit(idx){
  const o=occ(board), order=[...ACTIVE].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a));
  for(const i of idx) for(const s of order){
    if(solvable(o, idx.map(j=>j===i?s:tray[j]))){ tray[i]=s; return [i]; }
  }
  const set=[]; for(const i of idx){ const s=order.find(x=>solvable(o,[...set,x]))||DOT; set.push(s); tray[i]=s; }
  return idx;
}
let rescued=new Set();
function checkRescue(){
  const o=occ(board), idx=[0,1,2].filter(i=>!used[i]);
  if(!idx.length || mode==='puzzle') return;
  if(mode==='survival' || mode==='duelo'){ if(!idx.some(i=>anyFit(o,tray[i]))) modeStuck(idx); return; }
  if(mode==='eterno'){
    // Eterno: interviene apenas el resto de la tanda deja de tener salida completa
    if(solvable(o, idx.map(i=>tray[i]))) return;
    const ch=swapForExit(idx); rescues+=ch.length; rescued=new Set(ch);
    log(`Rescate: cambié ${ch.length===1?'1 pieza':ch.length+' piezas'} porque con lo que quedaba no había salida.`);
  } else {
    // Tutor: interviene solo cuando el juego real terminaría (ninguna pieza entra en ningún lado)
    if(idx.some(i=>anyFit(o,tray[i]))) return;
    const ch=swapForExit(idx); saves++; rescued=new Set(ch);
    game.saves=saves;
    // Puntos por vida: lo que sumaste desde el último rescate (o el inicio) hasta este
    game.lives=game.lives||[]; game.lives.push(score-(game.mark||0)); game.mark=score;
    log('Vida salvada: acá el juego real terminaba. Te cambié piezas para que sigas.');
  }
}

function hintCells(){

let drag=null;
function cellSize(){ const r=boardEl.getBoundingClientRect(); return (r.width-12-3*7)/8; }
function startDrag(e,i){
  e.preventDefault();
  if(drag || (drill && drill.answered) || (!drill && X.over)) return;
  const s=tray[i], cs=cellSize();
  dragEl.innerHTML=''; dragEl.style.gridTemplateColumns=`repeat(${s.w},${cs}px)`; dragEl.style.gridTemplateRows=`repeat(${s.h},${cs}px)`;
  s.cells.forEach(([r,c])=>{ const b=document.createElement('i'); b.className='blk'; b.style.setProperty('--col',s.col); b.style.gridRow=r+1; b.style.gridColumn=c+1; dragEl.appendChild(b); });
  dragEl.hidden=false;
  const lift = e.pointerType==='touch' ? 90 : 30;   // la pieza va por encima del dedo
  const bestSet = live() && analysis && analysis.per[i] && analysis.per[i].bestPos ? cellsOf(s,...analysis.per[i].bestPos) : null;
  drag={i,s,cs,lift,pos:null,id:e.pointerId,bestSet,wctx:warnCtx(i,s)};
  flash=null;
  trayEl.children[i].style.opacity=.25;
  document.body.classList.add('dragging');
  moveDrag(e);
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
}
function moveDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  const {s,cs,lift}=drag, W=s.w*cs+(s.w-1)*3, H=s.h*cs+(s.h-1)*3;
  const x=e.clientX-W/2, y=e.clientY-H-lift+cs/2;
  dragEl.style.transform=`translate(${x}px,${y}px)`;
  const br=boardEl.getBoundingClientRect();
  const c=Math.round((x-br.left-6)/(cs+3)), r=Math.round((y-br.top-6)/(cs+3));
  const o=occ(board);
  if(fits(o,s,r,c)){
    drag.pos=[r,c];
    // Qué filas/columnas se romperían si la soltás acá
    const pre=new Set(placeO(o,s,r,c).cleared);
    const w=warnFor(drag.wctx,o,s,r,c); showWarn(w);
    render({set:cellsOf(s,r,c), col:s.col, best:drag.bestSet, pre, warn:!!w});
  }
  else { drag.pos=null; showWarn(drag.wctx&&drag.wctx.orderMsg); render({set:new Set(), best:drag.bestSet}); }
}
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  window.removeEventListener('pointermove',moveDrag);
  window.removeEventListener('pointerup',endDrag);
  window.removeEventListener('pointercancel',endDrag);
  document.body.classList.remove('dragging');
  dragEl.hidden=true;
  const d=drag; drag=null; showWarn(null);
  if(e.type==='pointerup' && d.pos && fits(occ(board),d.s,d.pos[0],d.pos[1])) commit(d.i,d.pos[0],d.pos[1]);
  else { renderTray(); render(); }
}

const CAT = {

}
function commit(i,r,c){
  if(drill){ drillAttempt(i,r,c); return; }
  const s=tray[i];
  const trayNow=[0,1,2].filter(j=>!used[j]).map(j=>tray[j].id);   // la bandeja que veías, para ejercicios y reporte
  const before=occ(board);
  // Evaluación del tutor ANTES de cambiar el tablero
  let verdict=null;
  if(mode==='tutor'){
    if(!analysis) runAnalysis();
    verdict=judge(analysis,i,r,c);
  }
  const beforeStr = mode==='tutor' ? encodeBoard() : '';
  const res=placeO(before,s,r,c);
  for(const [a,b] of s.cells) board[(r+a)*N+c+b]=s.k;
  const colorHits=monoLines();                     // líneas de un solo tono, antes de borrarlas
  const popped=res.cleared.map(k=>[k,SHAPES[board[k]].col]);
  res.cleared.forEach(k=>board[k]=null);          // se limpia al instante; la animación va aparte
  const wasSwapped=rescued.has(i);
  used[i]=true; rescued.delete(i);
  const sc0=score;
  score+=s.cells.length;
  const bonus=extraPoints(res, colorHits);         // racha y línea de color (suman solo en Eterno y Survival)
  if(res.n){
    lines+=res.n; const pts=res.n*10*res.n+bonus.pts; score+=pts;
    const cb=$('#combo'); cb.textContent=(res.n>1?`¡x${res.n}! `:'')+`+${pts}`+(bonus.label?` · ${bonus.label}`:''); cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show');
  }
  if(album && mode==='eterno') album.pts+=score-sc0;
  if(mode==='survival') boostAfterMove(res, score-sc0);
  if(verdict) recordMove(verdict, s, i, r, c, before, res, beforeStr, wasSwapped, trayNow);
  after();
  popAnim(popped);
}
function recordMove(v, s, i, r, c, before, res, beforeStr, swapped, trayNow){
  const after=res.o, nAfter=after.reduce((a,x)=>a+x,0);
  const bst=analysis.best;
  // Causa probable del error, comparando tu tablero resultante con el de la jugada sugerida
  const restOf=(ids,id)=>{ const k=ids.indexOf(id); return ids.filter((_,j)=>j!==k).map(x=>BY_ID[x]||DOT); };
  const tags = v.cat==='optima' ? [] : causes(before, s, r, c, tray[bst.slot], bst.pos, v.orderErr, restOf(trayNow,s.id), restOf(trayNow,tray[bst.slot].id));
  // Foto del tablero antes de la jugada + sugerencia del motor + puntos que sumó, para el registro jugada a jugada
  const mv={b:beforeStr, pos:[r,c], bp:tray[bst.slot].id, bpos:bst.pos, pts:s.cells.length+res.n*10*res.n, ln:res.n, p:s.id, loss:+v.loss.toFixed(2), cat:v.cat, ord:v.orderErr?1:0, acc:+v.acc.toFixed(1),
    holes:Math.max(0, holes(after)-holes(before)), no3:anyFit(after,O3)?0:1, fill:nAfter, sw:swapped?1:0, h:live()?1:0, t:trayNow, tg:tags, cw:warnOn()?1:0};
  game.moves.push(mv);
  // Peor jugada: guardamos la foto del tablero para poder repetirla en el balance
  if(!game.worst || v.loss>game.worst.loss){
    const b=analysis.best, bs=tray[b.slot];
    game.worst={loss:v.loss, board:beforeStr, p:s.id, pos:[r,c], bp:bs.id, bpos:b.pos, ord:v.orderErr?1:0, n:game.moves.length};
  }
  if(live()){
    feedback(v, s, tags);
    // Si no fue óptima, marcamos un instante dónde iba la pieza
    if(v.cat!=='optima' && !v.orderErr && analysis.per[i].bestPos){  // (las pistas en vivo muestran dónde iba)
      flash=cellsOf(s,...analysis.per[i].bestPos);
      clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ flash=null; render(); },1400);
    }
  }
}

// ======================================================================
// Balance de la partida
// ======================================================================
// Puntaje global 0–100. No usa los puntos del juego: mide decisiones, no suerte con las tandas.
const WG = {dec:0.5, ord:0.15, sup:0.2, sal:0.15};
function summarize(g, pts, lns, sts){
  const m=g.moves, n=m.length;
  const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const cats={optima:0,buena:0,imprecisa:0,error:0}; m.forEach(x=>cats[x.cat]++);
  const ordErr=m.filter(x=>x.ord).length, holesC=m.reduce((a,x)=>a+x.holes,0), no3=m.filter(x=>x.no3).length;
  const dec=avg(m.map(x=>x.acc));
  const half=Math.floor(n/2), dec1=avg(m.slice(0,half).map(x=>x.acc)), dec2=avg(m.slice(half).map(x=>x.acc));
  const ord=100*(1-ordErr/n);
  const sup=Math.max(0, 100-25*(g.saves/(n/30)));            // cada vida salvada cada 30 jugadas resta 25
  const sal=50*(1-no3/n) + 50*Math.exp(-3*holesC/n);
  const global=WG.dec*dec + WG.ord*ord + WG.sup*sup + WG.sal*sal;
  // Pieza problemática: mayor pérdida promedio (con al menos 3 usos)
  // Las piezas que puso el rescate no cuentan: aparecen con el tablero ya trabado y no reflejan cómo manejás esa pieza.
  // La pérdida se topea en 20 para que una sola jugada desesperada no defina la pieza.
  const pc={}; m.filter(x=>!x.sw).forEach(x=>{ (pc[x.p]=pc[x.p]||{n:0,loss:0,bad:0}); pc[x.p].n++; pc[x.p].loss+=Math.min(32,x.loss); if(x.cat==='imprecisa'||x.cat==='error') pc[x.p].bad++; });
  let worstPiece=null; for(const [id,v] of Object.entries(pc)) if(v.n>=3 && (!worstPiece || v.loss/v.n>worstPiece.avg)) worstPiece={id,avg:v.loss/v.n,n:v.n,bad:v.bad};
  const hint=+(100*m.filter(x=>x.h).length/n).toFixed(0);   // % de jugadas hechas con pistas en vivo
  const aid=+(100*m.filter(x=>x.cw).length/n).toFixed(0);    // % con avisos del coach
  // Vidas: tramos de puntos entre rescates; el último tramo sigue "en curso" (terminaste vos, no el juego)
  const lives=[...(g.lives||[]), pts-(g.mark||0)], ppl=Math.round(pts/lives.length);
  const cz={}; m.forEach(x=>(x.tg||[]).forEach(t=>cz[t]=(cz[t]||0)+1));
  return {id:g.start, cv:4, date:new Date().toISOString(), start:g.start, n, hint, aid, cz, lives, ppl, points:pts, lines:lns, sets:sts, saves:g.saves,
    global:+global.toFixed(1), dec:+dec.toFixed(1), ord:+ord.toFixed(1), sup:+sup.toFixed(1), sal:+sal.toFixed(1),
    dec1:+dec1.toFixed(1), dec2:+dec2.toFixed(1), cats, ordErr, holes:holesC, no3, worstPiece, pieces:pc, worst:g.worst,
    log:m.map(x=>({b:x.b,pos:x.pos,bp:x.bp,bpos:x.bpos,p:x.p,cat:x.cat,loss:x.loss,ord:x.ord,pts:x.pts,ln:x.ln,h:x.h,sw:x.sw,t:x.t,tg:x.tg,cw:x.cw}))};
}
function finishGame(){
  if(mode!=='tutor') return;
  if(game.moves.length<MIN_MOVES){
    log(`Hacen falta al menos ${MIN_MOVES} jugadas para armar un balance (vas ${game.moves.length}).`);
    return;
  }
  const s=summarize(game, score, lines, sets);
  hist=hist.filter(h=>h.id!==s.id); hist.push(s); saveHist();
  showBalance(s, true);
  startGame('tutor');
}
function saveHist(){ hist.forEach(logUnclear); if(!store.set(LS.hist, JSON.stringify(hist))) $('#hMsg').textContent='No se pudo guardar el historial en este navegador (almacenamiento lleno o bloqueado).'; renderHist(); renderCoach(); }

const dateTxt=iso=>{ const d=new Date(iso); return d.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
const nameOf=id=>(BY_ID[id]||{name:id}).name;
function miniBoard(str, piece, pos, cls){
  const s=BY_ID[piece], mark=cellsOf(s,pos[0],pos[1]);
  const b=decodeBoard(str);
  return `<div class="mb">${b.map((v,i)=> mark.has(i) ? `<i class="${cls}"></i>` : v==null ? '<i></i>' : `<i class="on" style="--col:${SHAPES[v].col}"></i>`).join('')}</div>`;
}
function showBalance(s, fresh){
  const prev=hist.filter(h=>h.id!==s.id && h.date<s.date);
  const avgPrev=prev.length? prev.reduce((a,h)=>a+h.global,0)/prev.length : null;
  const d = avgPrev==null ? '' : (()=>{ const x=s.global-avgPrev; return `<span class="delta ${x>=0?'up':'down'}">${x>=0?'+':''}${x.toFixed(1)} vs tu promedio</span>`; })();
  const sub=(lbl,v,hint)=>`<div class="sub"><span>${lbl}<br><small>${hint}</small></span><div class="bar"><i style="width:${Math.max(2,v)}%"></i></div><b>${fmt(v)}</b></div>`;
  const c=s.cats, tot=s.n;
  const seg=(k)=>c[k]?`<i style="width:${100*c[k]/tot}%;background:${CAT[k].k}"></i>`:'';
  const legend=Object.keys(CAT).map(k=>`<span><i style="background:${CAT[k].k}"></i>${CAT[k].t} <b>${c[k]}</b></span>`).join('');
  const w=s.worst;
  let worstHtml='';
  if(w){
    const why = w.ord ? `El problema fue el orden: convenía arrancar con <em>${nameOf(w.bp)}</em>.` : `La pieza <em>${nameOf(w.p)}</em> tenía un lugar mejor.`;
    worstHtml=`<div><h3>Peor jugada · nº ${w.n}</h3></div>
      <div class="replay">
        <div class="rb"><span>Lo que hiciste</span>${miniBoard(w.board,w.p,w.pos,'you')}</div>
        <div class="rb"><span>La mejor</span>${miniBoard(w.board,w.bp,w.bpos,'opt')}</div>
      </div>
      <p class="note">${why} Te costó ${w.loss.toFixed(1)} puntos de evaluación.</p>`;
  }
  let topHtml='';
  if(s.log && s.log.length){
    let k=0; s.log.forEach((x,j)=>{ if(x.pts>s.log[k].pts) k=j; });
    const x=s.log[k];
    topHtml=`<div><h3>Jugada que más puntos aportó · nº ${k+1}</h3></div>
      <div class="replay one"><div class="rb"><span>+${x.pts} pts${x.ln?` · ${x.ln} ${x.ln===1?'línea':'líneas'}`:''}</span>${miniBoard(x.b,x.p,x.pos,'hit')}</div></div>
      <p class="note">La pieza <em>${nameOf(x.p)}</em> en esa posición ${x.ln?`rompió ${x.ln===1?'una línea':x.ln+' líneas a la vez'}`:'sumó sus bloques'}. Calificación del motor: ${CAT[x.cat].t.toLowerCase()}.</p>`;
  }
  const wp=s.worstPiece;
  const fatigue = s.dec2 < s.dec1-5 ? `Bajó en la 2ª mitad (${fmt(s.dec1)} → ${fmt(s.dec2)})` : s.dec2 > s.dec1+5 ? `Mejoró en la 2ª mitad (${fmt(s.dec1)} → ${fmt(s.dec2)})` : `Pareja en toda la partida (${fmt(s.dec1)} / ${fmt(s.dec2)})`;
  $('#sheet').innerHTML=`
    <div class="bal-top">
      <div><h2 id="balTitle">${fresh?'Balance de la partida':'Partida guardada'}</h2><div class="bal-date">${dateTxt(s.date)} · ${s.n} jugadas</div></div>
      <button type="button" id="closeBal" class="ghost">Cerrar</button>
    </div>
    <div class="global">
      <div><div class="big">${fmt(s.global)}</div><div class="lbl">Puntaje global</div></div>
      <div class="side"><b>${s.points} pts</b><span class="lbl">Puntos del juego</span>${d}</div>
    </div>
    <div class="subs">
      ${sub('Decisiones',s.dec,'precisión de cada jugada')}
      ${sub('Orden',s.ord,'elegir qué pieza va primero')}
      ${sub('Supervivencia',s.sup,'vidas salvadas por jugada')}
      ${sub('Salud del tablero',s.sal,'huecos y lugar para el 3×3')}
    </div>
    ${coachNote(s)}
    <div><h3>Jugadas</h3><div class="dist" style="margin-top:8px">${['optima','buena','imprecisa','error'].map(seg).join('')}</div><div class="dist-l">${legend}</div></div>
    <div class="kpis">
      <div class="kpi"><b>${s.saves}</b><span>Partidas que habrías perdido (vidas salvadas)</span></div>
      ${s.lives?`<div class="kpi wide"><b>${s.ppl} pts por vida</b><span>${s.lives.length===1?'Una sola vida: no hubo rescates':`Por vida: ${s.lives.map((v,k)=>k===s.lives.length-1?`${v} (la última, sin perder)`:v).join(' · ')}`}</span></div>`:''}
      <div class="kpi"><b>${s.ordErr}</b><span>Errores de orden</span></div>
      <div class="kpi"><b>${s.holes}</b><span>Huecos aislados que dejaste</span></div>
      <div class="kpi"><b>${s.no3}</b><span>Jugadas que te dejaron sin lugar para el 3×3</span></div>
      <div class="kpi wide"><b>${wp?nameOf(wp.id):'—'}</b><span>${wp?`Pieza problemática: pierde ${wp.avg.toFixed(1)} en promedio, ${wp.bad} de ${wp.n} jugadas imprecisas o errores`:'Pieza problemática: ninguna se usó 3 veces o más'}</span></div>
      <div class="kpi wide"><b style="font-size:1.05rem">${fatigue}</b><span>Precisión: 1ª mitad vs 2ª mitad de la partida</span></div>
      <div class="kpi wide"><b style="font-size:1.05rem">${s.hint==null?'Sin dato':s.hint===0?'Sin pistas':s.hint+'% de las jugadas'}${s.aid?` · avisos ${s.aid}%`:''}</b><span>Uso de pistas en vivo${s.aid?' y avisos del coach':''}${s.hint>0||s.aid>0?' · no refleja solo tus decisiones':''}</span></div>
    </div>
    ${worstHtml}
    ${topHtml}
    ${logHTML(s)}
    <p class="foot">Contexto: ${s.lines} líneas en ${s.sets} tandas. El global pondera Decisiones 50%, Supervivencia 20%, Orden 15% y Salud del tablero 15%; los puntos del juego no entran, por eso una partida con menos puntos puede puntuar mejor. Cada jugada se compara con la mejor posible usando solo lo que veías: el tablero y las piezas de esa tanda.</p>
    <div class="delrow"><button type="button" id="balDel" class="ghost">Borrar esta partida del historial</button>
      <span id="balConf" hidden>¿Seguro? <button type="button" id="balYes">Sí, borrar</button> <button type="button" id="balNo" class="ghost">No</button></span></div>`;
  $('#sheetWrap').hidden=false;
  $('#closeBal').focus();
  $('#closeBal').addEventListener('click',closeBalance);
  bindLog(s);
  $('#balDel').addEventListener('click',()=>{ $('#balConf').hidden=false; $('#balDel').hidden=true; });
  $('#balNo').addEventListener('click',()=>{ $('#balConf').hidden=true; $('#balDel').hidden=false; });
  $('#balYes').addEventListener('click',()=>{
    hist=hist.filter(h=>h.id!==s.id); saveHist(); closeBalance();
    $('#hMsg').textContent=`Partida del ${dateTxt(s.date)} borrada.`;
  });
}

const differs=x=>!(x.bp===x.p && x.bpos && x.bpos[0]===x.pos[0] && x.bpos[1]===x.pos[1]);
function logHTML(s){
  if(!s.log) return `<div><h3>Jugada a jugada</h3><p class="empty">Esta partida se guardó antes de que existiera el registro por jugada.</p></div>`;
  const rows=s.log.map((x,k)=>`<details class="mv" data-k="${k}"><summary>
      <span class="mvn">${k+1}</span><span class="mvp">${nameOf(x.p)}${x.h?'<span class="tag hinted">pista</span>':''}</span>
      <span class="mvpts">+${x.pts}</span><span class="pill" style="--k:${CAT[x.cat].k}">${CAT[x.cat].t}</span></summary><div class="mvbody"></div></details>`).join('');
  const nd=s.log.filter(differs).length;
  return `<details class="log"><summary><h3>Jugada a jugada · ${s.log.length}</h3></summary>
    <div class="logtools"><label class="tg" for="onlyDiff"><input type="checkbox" id="onlyDiff"> Solo las que no coinciden con el motor (${nd})</label></div>
    <div class="mvlist">${rows}</div></details>`;
}
function mvBody(x){
  const ln = x.ln ? ` Rompió ${x.ln===1?'una línea':x.ln+' líneas'}.` : '';
  if(!differs(x)) return `<div class="replay one"><div class="rb"><span>Tu jugada · coincide con el motor</span>${miniBoard(x.b,x.p,x.pos,'opt')}</div></div>
    <p class="note">+${x.pts} pts.${ln}</p>`;
  const equal = x.loss<=CUT.optima;
  const why = equal ? 'Elegiste una alternativa igual de buena que la sugerida.'
    : x.ord ? `Convenía empezar por la pieza <em>${nameOf(x.bp)}</em>.`
    : x.tg && x.tg.length ? `Probable causa: ${x.tg.map(t=>CAUSE[t].short).join(', ')}.`
    : x.bp===x.p ? `La pieza <em>${nameOf(x.p)}</em> tenía un lugar mejor.`
    : `El motor sugería otra jugada: la pieza <em>${nameOf(x.bp)}</em> en el lugar marcado.`;
  return `<div class="replay">
      <div class="rb"><span>Lo que hiciste</span>${miniBoard(x.b,x.p,x.pos,equal?'opt':'you')}</div>
      <div class="rb"><span>Sugerencia del motor</span>${miniBoard(x.b,x.bp,x.bpos,'opt')}</div></div>
    <p class="note">${why}${equal?'':` Costó ${x.loss.toFixed(1)} puntos de evaluación.`} +${x.pts} pts.${ln}</p>`;
}
function bindLog(s){
  if(!s.log) return;
  // Las fotos se arman recién al abrir cada jugada: una partida larga tendría miles de celdas
  $('#sheet').querySelectorAll('details.mv').forEach(d=>{
    d.querySelector('summary').addEventListener('click',()=>{ const b=d.querySelector('.mvbody'); if(!b.innerHTML) b.innerHTML=mvBody(s.log[+d.dataset.k]); });
  });
  const od=$('#onlyDiff');
  if(od) od.addEventListener('change',()=>{ $('#sheet').querySelectorAll('details.mv').forEach(d=>{ d.hidden = od.checked && !differs(s.log[+d.dataset.k]); }); });
}

const hintKind=h=> h.hint==null ? 'unk' : h.hint===0 ? 'clean' : 'hinted';
let hFilter = store.get('be-hfilter') || 'clean';
function renderHist(){
  const body=$('#hBody');
  const H=[...hist].filter(h=> hFilter==='all' || hintKind(h)===hFilter).sort((a,b)=>a.date<b.date?-1:1);
  $('#hCount').textContent = hist.length ? `${H.length} de ${hist.length} ${hist.length===1?'partida':'partidas'}` : '';
  const filt = hist.length ? `<label class="tg" for="hFilter">Mostrar <select id="hFilter">
      <option value="clean"${hFilter==='clean'?' selected':''}>Solo sin pistas</option>
      <option value="hinted"${hFilter==='hinted'?' selected':''}>Solo con pistas</option>
      <option value="all"${hFilter==='all'?' selected':''}>Todas</option></select></label>` : '';
  if(hist.length && !H.length){
    body.innerHTML = filt + `<p class="empty">No hay partidas en este filtro. ${hFilter==='clean'?'Jugá en Tutor con “Pistas en vivo” apagado para medir solo tus decisiones.':''}</p>`;
    bindFilter(); return;
  }
  if(!H.length){
    body.innerHTML=`<p class="empty">Todavía no hay partidas. Jugá en modo <b>Tutor</b> y tocá “Terminar y ver balance” (mínimo ${MIN_MOVES} jugadas). Cada partida queda guardada con fecha en este dispositivo.</p>`;
    return;
  }
  body.innerHTML = filt + chartSVG(H.slice(-30)) + patternsHTML(H) + tableHTML([...H].reverse());
  bindFilter();

    tr.addEventListener('click',open);
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  });
}
function chartSVG(H){
  const W=400, Hh=150, L=28, R=12, T=12, B=22, iw=W-L-R, ih=Hh-T-B;
  const x=i=> H.length===1 ? L+iw/2 : L+iw*i/(H.length-1);
  const y=v=> T+ih*(1-v/100);
  const line=(k,col,wid)=>{
    const pts=H.map((h,i)=>`${x(i).toFixed(1)},${y(h[k]).toFixed(1)}`);
    return `<polyline points="${pts.join(' ')}" fill="none" style="stroke:${col}" stroke-width="${wid}" stroke-linejoin="round" stroke-linecap="round"/>`+
      H.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h[k]).toFixed(1)}" r="${i===H.length-1?4:2.5}" style="fill:${col}"/>`).join('');
  };
  const grid=[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v}</text>`).join('');
  const last=H[H.length-1];
  const lbl=`<text x="${x(0)}" y="${Hh-6}" font-size="10" style="fill:var(--muted)">${new Date(H[0].date).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</text>`+
    (H.length>1?`<text x="${x(H.length-1)}" y="${Hh-6}" font-size="10" text-anchor="end" style="fill:var(--muted)">${new Date(last.date).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</text>`:'');
  return `<div><h3>Tendencia · últimas ${H.length}</h3><div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Puntaje global y decisiones por partida">${grid}${line('dec','var(--muted)',1.5)}${line('global','var(--gold)',2.5)}${lbl}</svg></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Global</span><span><i style="background:var(--muted)"></i>Decisiones</span></div></div>`;
}
function bindFilter(){ const f=$('#hFilter'); if(f) f.addEventListener('change',()=>{ hFilter=f.value; store.set('be-hfilter',hFilter); renderHist(); }); }
function patternsHTML(H){
  const out=[], avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  if(H.length<3){ return `<div class="patterns"><h3>Patrones</h3><p class="empty">Con 3 partidas o más aparecen los patrones (tendencia, pieza problemática, cansancio, momento del día).</p></div>`; }
  // Tendencia: últimas 5 contra las 5 anteriores (o mitades si hay pocas)
  const k=Math.min(5, Math.floor(H.length/2)), rec=H.slice(-k), prv=H.slice(-2*k,-k);
  const dt=avg(rec.map(h=>h.global))-avg(prv.map(h=>h.global));
  out.push(Math.abs(dt)<2 ? `Estable: tus últimas ${k} partidas promedian casi lo mismo que las ${k} anteriores (${fmt(avg(rec.map(h=>h.global)))}).`
    : `${dt>0?'Mejorando':'Bajando'}: tus últimas ${k} partidas promedian ${fmt(avg(rec.map(h=>h.global)))} de global, ${dt>0?'+':''}${dt.toFixed(1)} contra las ${k} anteriores.`);
  // Pieza problemática acumulada
  const agg={}; H.forEach(h=>Object.entries(h.pieces||{}).forEach(([id,v])=>{ (agg[id]=agg[id]||{n:0,loss:0}); agg[id].n+=v.n; agg[id].loss+=v.loss; }));
  const ranked=Object.entries(agg).filter(([,v])=>v.n>=8).map(([id,v])=>({id,avg:v.loss/v.n,n:v.n})).sort((a,b)=>b.avg-a.avg);
  if(ranked.length>=2) out.push(`Tu pieza más difícil: <b>${nameOf(ranked[0].id)}</b> (pierde ${ranked[0].avg.toFixed(1)} por jugada en ${ranked[0].n} usos). La que mejor manejás: ${nameOf(ranked[ranked.length-1].id)}.`);
  // Cansancio: ¿la precisión cae en la segunda mitad?
  const drops=H.filter(h=>h.dec2<h.dec1-5).length;
  out.push(drops>=H.length/2 ? `En ${drops} de ${H.length} partidas tu precisión cae en la segunda mitad: probablemente te conviene cortar antes o bajar el ritmo.`
    : `Tu precisión no suele caer al final de la partida (${drops} de ${H.length} con caída).`);
  // Momento del día
  const fr=h=>{ const t=new Date(h.date).getHours(); return t<6?'madrugada':t<12?'mañana':t<19?'tarde':'noche'; };
  const by={}; H.forEach(h=>{ (by[fr(h)]=by[fr(h)]||[]).push(h.global); });
  const fs=Object.entries(by).filter(([,v])=>v.length>=2).map(([f,v])=>({f,a:avg(v),n:v.length})).sort((a,b)=>b.a-a.a);
  if(fs.length>=2) out.push(`Jugás mejor a la ${fs[0].f} (${fmt(fs[0].a)} de global) que a la ${fs[fs.length-1].f} (${fmt(fs[fs.length-1].a)}).`);
  // Errores de orden recurrentes
  const ordRate=avg(H.map(h=>h.ordErr/h.n))*100;
  if(ordRate>=8) out.push(`El ${fmt(ordRate)}% de tus jugadas tiene error de orden: antes de mover, mirá las tres piezas y empezá por la más difícil de ubicar.`);
  return `<div class="patterns"><h3>Patrones</h3><ul>${out.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}
function tableHTML(H){
  const col=v=>v>=80?'var(--c-opt)':v>=65?'var(--c-good)':v>=50?'var(--c-imp)':'var(--c-err)';
  const rows=H.map(h=>{ const d=new Date(h.date);
    return `<tr tabindex="0" data-id="${h.id}"><td>${d.toLocaleDateString('es-AR',{day:'numeric',month:'short'})} ${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}${hintKind(h)==='hinted'?`<span class="tag hinted">pistas ${h.hint}%</span>`:hintKind(h)==='unk'?'<span class="tag unk">sin dato</span>':''}${h.aid?`<span class="tag hinted">avisos ${h.aid}%</span>`:''}</td>
      <td><span class="gpill" style="color:${col(h.global)}">${fmt(h.global)}</span></td><td>${fmt(h.dec)}</td><td>${h.points}</td><td>${h.ppl??'–'}</td><td>${h.saves}</td><td>${h.n}</td></tr>`; }).join('');
  return `<div><h3>Partidas · tocá una para ver su balance</h3><div class="tbl"><table>
    <thead><tr><th>Fecha</th><th>Global</th><th>Decis.</th><th>Puntos</th><th>Pts/vida</th><th>Rescates</th><th>Jug.</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// Coach: diagnóstico, foco, seguimiento, avisos, ejercicios y reporte
// ======================================================================
const COACH_MIN = {games:3, moves:60};     // menos que esto es ruido: el coach no opina
const byDate=(a,b)=>a.date<b.date?-1:1;
// Partida medible: registro nuevo (con causas), sin pistas en vivo ni avisos del coach
const eligible=h=> h.cv>=3 && h.hint===0 && !(h.aid>0) && Array.isArray(h.log);
function saveCoach(){ store.set(LS.coach, JSON.stringify(coach)); }
function saveDrills(){ store.set(LS.drills, JSON.stringify(drills)); }

// Costo de cada causa cada 100 jugadas. Si una jugada tiene varias causas, la pérdida se reparte entre ellas.
function rates(games){
  let n=0, otro=0; const c={}; Object.keys(CAUSE).forEach(k=>c[k]={cost:0,cnt:0});
  games.forEach(g=>g.log.forEach(x=>{
    if(x.sw) return; n++;
    const tg=x.tg||[]; if(x.loss<=CUT.optima) return;
    if(!tg.length){ if(x.loss>CUT.buena) otro++; return; }
    // Tope de 32 para que una jugada desesperada no defina todo, salvo la bandeja trabada: ahí la pérdida enorme es real (es perder)
    const part=(tg.includes('block') ? x.loss : Math.min(32,x.loss))/tg.length;
    tg.forEach(k=>{ if(c[k]){ c[k].cost+=part; c[k].cnt++; } });
  }));
  const out={n, otro}; for(const k in c) out[k]={per100: n ? 100*c[k].cost/n : 0, cnt:c[k].cnt};
  return out;
}
function setFocus(k, R){ coach.focus=k; coach.since=new Date().toISOString(); coach.base=R[k].per100; saveCoach(); }

// Lee el historial, elige o mantiene el foco y decide si ya lo superaste
function updateCoach(){
  const E=hist.filter(eligible).sort(byDate);
  const moves=E.reduce((a,g)=>a+g.log.length,0);
  if(E.length<COACH_MIN.games || moves<COACH_MIN.moves) return {ready:false, E, moves};
  const R=rates(E);
  const rank=Object.keys(CAUSE).map(k=>({k, v:R[k].per100, cnt:R[k].cnt})).sort((a,b)=>b.v-a.v);
  if(!coach.focus || !CAUSE[coach.focus]) setFocus(rank[0].k, R);
  let prog=null;
  const since=E.filter(g=>g.date>coach.since);
  if(coach.grad && since.length){ coach.grad=null; saveCoach(); }   // el aviso de foco superado se muestra hasta la próxima partida
  if(since.length){
    const cur=rates(since)[coach.focus].per100;
    prog={games:since.length, cur};
    // Superado: con al menos 3 partidas, el costo de tu foco bajó 30% o más respecto de tu base
    if(since.length>=3 && cur<=coach.base*0.7){
      coach.done.push({k:coach.focus, from:coach.since, to:new Date().toISOString(), base:+coach.base.toFixed(1), end:+cur.toFixed(1)});
      coach.grad={k:coach.focus, base:coach.base, end:cur};
      const next=rank.find(x=>x.k!==coach.focus) || rank[0];
      setFocus(next.k, R); prog=null;
    }
  }
  return {ready:true, E, moves, R, rank, prog};
}
function renderCoach(){

  $('#cNext').hidden = !st.ready;
  $('#warn').disabled = !st.ready;

      Cuentan las partidas del <b>Tutor</b> jugadas con “Pistas en vivo” y los avisos apagados, porque solo esas miden tus propias decisiones.${hasNew?'':' Las partidas guardadas antes de esta versión no tienen las causas de cada error, así que no suman.'}</p>

  const f=coach.focus, max=Math.max(...st.rank.map(r=>r.v), 1);
  const g=coach.grad;
  const gradHtml = g ? `<div class="grad">Foco superado: <b>${CAUSE[g.k].t}</b>. Bajaste de ${g.base.toFixed(1)} a ${g.end.toFixed(1)} cada 100 jugadas. Tu nuevo foco es el siguiente de la lista.</div>` : '';
  let progTxt;
  if(!st.prog) progTxt='Jugá partidas medibles para ver si mejora: lo evalúo después de 3.';
  else{
    const d=coach.base>0 ? 100*(st.prog.cur-coach.base)/coach.base : 0;
    progTxt=`Desde que es tu foco: ${st.prog.cur.toFixed(1)} en ${st.prog.games} ${st.prog.games===1?'partida':'partidas'} (${d<=0?'':'+'}${d.toFixed(0)}% vs tu base).`+
      (st.prog.games>=3 ? ' Se supera al bajar 30% o más.' : ` Lo evalúo con 3 partidas (faltan ${3-st.prog.games}).`)+
      (st.prog.games>=6 && st.prog.cur>coach.base*0.85 ? ' Todavía no se mueve: sumá ejercicios y avisos en las partidas de práctica.' : '');
  }
  const bars=st.rank.map(r=>`<div class="sub${r.k===f?' on':''}"><span>${CAUSE[r.k].t}<br><small>${r.cnt} ${r.cnt===1?'jugada':'jugadas'}</small></span><div class="bar"><i style="width:${Math.max(2,100*r.v/max)}%"></i></div><b>${r.v.toFixed(1)}</b></div>`).join('');
  const otro=st.R.otro ? `<p class="done">${st.R.otro} ${st.R.otro===1?'error':'errores'} sin causa clara: el motor ve una jugada mejor, pero la diferencia no encaja en ninguna de estas categorías.</p>` : '';
  const P=findPatterns(st.E);
  const done=coach.done.length ? `<p class="done">Focos superados: ${coach.done.map(d=>`${CAUSE[d.k].t} (${d.base} → ${d.end})`).join(' · ')}</p>` : '';
  body.innerHTML=`${gradHtml}
    <div class="focus"><span class="fl">Tu foco ahora</span><span class="ft">${CAUSE[f].t}</span>
      <span class="note">Base: te cuesta ${coach.base.toFixed(1)} puntos de evaluación cada 100 jugadas. ${progTxt}</span>
      ${focusContext(f,P)}
      <p class="tip">${CAUSE[f].tip}</p></div>
    ${patternsBlock(P)}
    <div class="rank"><h3>Tus falencias · costo cada 100 jugadas</h3>${bars}</div>${otro}${done}`;
}
$('#cNext').addEventListener('click',()=>{

function coachNote(s){
