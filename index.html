// ---------- Avisos dirigidos: solo sobre tu foco, comparando con el mejor lugar para esa misma pieza ----------
function warnCtx(i,s){
  if(!warnOn() || !analysis || !analysis.per[i] || !analysis.per[i].bestPos) return null;
  const o=occ(board), e=analysis.per[i], bRes=placeO(o,s,...e.bestPos), bAfter=bRes.o;
  const rest=[0,1,2].filter(j=>!used[j] && j!==i).map(j=>tray[j]);
  const ctx={f:coach.focus, e, bAfter, bHoles:holes(bAfter), b3:anyFit(bAfter,O3), bP:pFit(bAfter), bR:rough(bAfter), bN:bRes.n, rest, cache:new Map(), orderMsg:null};
  if(ctx.f==='miss') ctx.bTot=bRes.n+bestSeqL(bAfter,rest).lines;
  if(ctx.f==='order' && analysis.nSlots>1 && analysis.best.val-e.bestVal>CUT.buena) ctx.orderMsg='Ojo con el orden: convendría empezar por otra pieza';
  return ctx;
}
function warnFor(ctx,o,s,r,c){
  if(!ctx) return null;
  if(ctx.orderMsg) return ctx.orderMsg;
  const u=placeO(o,s,r,c);
  switch(ctx.f){
    case 'hole':   return holes(u.o)>ctx.bHoles ? 'Ojo: acá dejás un hueco' : null;
    case 'no3':    return !anyFit(u.o,O3) && ctx.b3 ? 'Ojo: te quedás sin lugar para el 3×3' : null;
    case 'frag':   return pFit(u.o)<ctx.bP-0.1 ? 'Ojo: achicás el espacio útil' : null;
    case 'rough':  return rough(u.o)>=ctx.bR+4 ? 'Ojo: dejás escalones y salientes' : null;
    case 'block':  { const k=r*N+c; if(!ctx.cache.has(k)) ctx.cache.set(k, bestSeqL(u.o,ctx.rest).dead>0);
                     return ctx.cache.get(k) ? 'Ojo: con esta jugada no te entran las otras piezas' : null; }
    case 'miss':   { const k=r*N+c; if(!ctx.cache.has(k)) ctx.cache.set(k, u.n+bestSeqL(u.o,ctx.rest).lines);
                     return ctx.cache.get(k)<ctx.bTot && (ctx.e.table.get(k)??-Infinity) < ctx.e.bestVal-CUT.buena ? 'Ojo: con la bandeja completa podés romper más líneas' : null; }
    case 'greedy': return u.n>0 && (ctx.e.table.get(r*N+c)??-Infinity) < ctx.e.bestVal-CUT.buena ? 'Ojo: romper líneas acá te deja peor' : null;
  }
  return null;
}
function showWarn(msg){
  const fb=$('#fb');
  if(!msg){ if(fb.classList.contains('warn')) fb.classList.remove('show','warn'); return; }
  clearTimeout(fbTimer);
  fb.innerHTML=`<span class="tag" style="--k:var(--c-err)">Coach</span><span class="why">${msg}</span>`;
  fb.classList.add('show','warn');
}

// ---------- Ejercicios con tus errores (repetición espaciada) ----------
const DAYS=[0,1,3,7,21], DAY=864e5;       // caja 0..4; en la 5 queda dominado
function drillPool(){
  const out=[];
  hist.forEach(g=>{ if(!(g.cv>=3) || !g.log) return;
    g.log.forEach((x,k)=>{ if(!x.sw && x.t && x.loss>CUT.buena) out.push({id:g.id+'#'+k, x, g}); }); });
  return out;
}
function dueDrills(){
  const now=Date.now(), st=id=>drills[id]||{box:0,due:0};
  const onFocus=d=>(d.x.tg||[]).includes(coach.focus)?1:0;
  return drillPool().filter(d=>{ const s=st(d.id); return s.box<5 && s.due<=now; })
    .sort((a,b)=>(onFocus(b)-onFocus(a)) || (b.x.loss-a.x.loss));      // primero tu foco, después los más caros
}
function drillUI(on){
  $('#rowMain').hidden=on; $('#drillBar').hidden=!on;
  if(on){ ['#rowTutor','#rowEterno','#rowSurv','#rowDuel','#rowPuzzle'].forEach(q=>$(q).hidden=true); } else syncModeUI();
}
$('#drillGo').addEventListener('click',()=>{
  if(drill) return;
  const q=dueDrills().slice(0,10);
  if(!q.length){ $('#cMsg').textContent='No tenés ejercicios pendientes.'; return; }
  drill={queue:q, idx:0, ok:0, done:0, answered:false,
    snap:{board:board.slice(), tray:tray.slice(), used:used.slice(), rescued:new Set(rescued), analysis}};
  rescued=new Set(); drillUI(true); loadDrill();
  $('#board').scrollIntoView({behavior:'smooth', block:'start'});
});
function loadDrill(){
  flash=null; drill.answered=false; $('#drillNext').hidden=true; $('#drillSkip').hidden=false;
  while(drill.idx<drill.queue.length){
    const d=drill.queue[drill.idx], x=d.x;
    board=decodeBoard(x.b); tray=x.t.map(id=>BY_ID[id]||DOT); used=tray.map(()=>false);
    while(tray.length<3){ tray.push(DOT); used.push(true); }
    const slots=[0,1,2].filter(j=>!used[j]).map(j=>({i:j,s:tray[j]}));
    analysis=analyze(occ(board), slots);
    // Se reevalúa con el motor actual: si tu jugada original ya no es un error, el ejercicio se retira
    const k=tray.findIndex((t,j)=>!used[j] && t.id===x.p);
    const orig = k>=0 && analysis.per[k].table.has(x.pos[0]*N+x.pos[1]) ? judge(analysis,k,x.pos[0],x.pos[1]) : null;
    if(!orig || orig.loss<=CUT.buena){ drills[d.id]={box:5, due:0}; saveDrills(); drill.idx++; continue; }
    $('#drillTxt').innerHTML=`Tablero real de tu partida del ${dateTxt(d.g.date)} (jugada ${+d.id.split('#')[1]+1}). <b style="--k:var(--gold)">Encontrá la mejor jugada</b> con estas piezas.`;
    renderTray(); render(); log('');
    return;
  }
  endDrill();
}
function drillAttempt(i,r,c){
  const d=drill.queue[drill.idx], s=tray[i], v=judge(analysis,i,r,c), b=analysis.best, bs=tray[b.slot];
  const prev=drills[d.id]||{box:0,due:0}, now=Date.now();
  let txt;
  if(v.loss<=CUT.optima){
    drill.ok++; const box=prev.box+1;
    drills[d.id]={box, due: box>=5 ? 0 : now+DAYS[box]*DAY};
    txt=`<b style="--k:var(--c-opt)">Correcto.</b> ${box>=5?'Este ya lo dominás: no vuelve.':`Vuelve en ${DAYS[box]} ${DAYS[box]===1?'día':'días'} para fijarlo.`}`;
  } else if(v.loss<=CUT.buena){
    drills[d.id]={box:prev.box, due:now+DAY};
    txt=`<b style="--k:var(--c-good)">Casi.</b> Es buena, pero la mejor es <em>${bs.name}</em> en el lugar marcado en verde. Vuelve mañana.`;
  } else {
    const ids=[0,1,2].filter(j=>!used[j]).map(j=>tray[j].id), restOf=id=>{ const k=ids.indexOf(id); return ids.filter((_,j)=>j!==k).map(x=>BY_ID[x]); };
    const tg=causes(occ(board), s, r, c, bs, b.pos, v.orderErr, restOf(s.id), restOf(bs.id));
    drills[d.id]={box:0, due:now+10*60e3};
    txt=`<b style="--k:var(--c-err)">No.</b> La mejor es <em>${bs.name}</em> en el lugar marcado en verde.${tg.length?` Con tu jugada ${tg.map(t=>CAUSE[t].short).join(', ')}.`:''} Vuelve en 10 minutos.`;
  }
  saveDrills(); drill.answered=true; drill.done++;
  $('#drillTxt').innerHTML=txt; $('#drillNext').hidden=false; $('#drillSkip').hidden=true;
  flash=cellsOf(bs,...b.pos);
  render({set:cellsOf(s,r,c), col:s.col});
}
$('#drillNext').addEventListener('click',()=>{ drill.idx++; loadDrill(); });
$('#drillSkip').addEventListener('click',()=>{ drill.idx++; loadDrill(); });
$('#drillExit').addEventListener('click',()=>endDrill());
function endDrill(){
  if(!drill) return;
  const {snap, ok, done}=drill;
  board=snap.board; tray=snap.tray; used=snap.used; rescued=snap.rescued; analysis=snap.analysis;
  drill=null; flash=null; drillUI(false); renderTray(); render(); renderCoach();
  log(done ? `Ejercicios: ${ok} de ${done} ${ok===1?'correcto':'correctos'}. Seguís con tu partida.` : 'Seguís con tu partida.');
}

// ---------- Reporte para Claude: instrucciones + datos en un solo archivo ----------
const PROMPT=`Sos el coach de un jugador de Bloque Eterno, un puzzle de bloques 8×8 estilo Block Blast: se colocan piezas de una bandeja de 3 (sin rotarlas) y cada fila o columna completa se borra. Tu tarea es diagnosticar cómo juega y armarle un plan de entrenamiento.

Cómo leer los datos
- Un motor evaluó cada jugada comparándola con la mejor posible usando solo lo que el jugador veía: el tablero y las piezas de su bandeja. "perdida" es la diferencia en puntos de evaluación; 0 es jugar como el motor.
- El motor valora el largo plazo: además de las líneas que se rompen, premia que la próxima pieza al azar tenga lugar (según la frecuencia real de cada pieza) y castiga los huecos aislados.
- Solo las partidas con "medible": true (sin pistas en vivo ni avisos del coach) reflejan decisiones propias. Usá las demás solo como contexto, y aclaralo cuando lo hagas.
- Los tableros van como 8 filas de arriba hacia abajo; "#" es ocupado y "." vacío. Las posiciones son fila y columna desde 0 (arriba a la izquierda) de la esquina superior izquierda del rectángulo que ocupa la pieza. Las formas de las piezas van fila por fila separadas por "/".

Qué hacer
1. Diagnóstico: las 2 o 3 falencias principales, con evidencia concreta de los datos (cifras, partidas, jugadas). Distinguí patrones consistentes de casos aislados. Una causa como "Te trabaste la bandeja" es un resultado, no una explicación: usá "patrones_de_decision" (llenado del tablero, orden, qué pieza de la tanda, con qué pieza arranca, piezas, zona) para explicar cuándo y por qué pasa, y qué tendría que mirar distinto.
2. Tendencia: si mejora, empeora o está estable, considerando el tamaño de la muestra.
3. Análisis de jugadas: elegí 3 de las peores jugadas y explicá en cada una qué principio de juego se rompió y cómo reconocer esa situación la próxima vez. Apoyate en los números del motor; si al mirar el tablero la sugerencia no te cierra, decilo en vez de inventar una justificación.
4. Plan: una semana de entrenamiento concreta con lo que ofrece el juego (foco del coach, ejercicios con sus propios errores, avisos durante la partida, pistas en vivo, y partidas sin ayuda para medir).
5. Qué datos faltan o qué convendría medir distinto para afinar el diagnóstico.

Estilo: español rioplatense, directo y concreto, sin relleno ni elogios vacíos. Si la muestra es chica, decilo y bajá la confianza de las conclusiones. No inventes datos que no estén en el reporte.`;
function buildReport(){
  const st=updateCoach();
  const shape=s=>{ const g=[...Array(s.h)].map(()=>Array(s.w).fill('.')); s.cells.forEach(([r,c])=>g[r][c]='#'); return g.map(r=>r.join('')).join('/'); };
  const rows=str=>{ const b=decodeBoard(str); return [...Array(8)].map((_,r)=>b.slice(r*8,r*8+8).map(v=>v==null?'.':'#').join('')); };
  const r1=v=>v==null?null:+(+v).toFixed(1);
  const partidas=[...hist].sort(byDate).map(h=>({fecha:h.date, jugadas:h.n, medible:eligible(h), pistas_pct:h.hint??null, avisos_pct:h.aid||0,
    global:h.global, decisiones:h.dec, orden:h.ord, supervivencia:h.sup, salud_tablero:h.sal, puntos:h.points, lineas:h.lines, vidas_salvadas:h.saves, puntos_por_vida:h.ppl??null, puntos_de_cada_vida:h.lives||null,
    calificaciones:h.cats, causas:h.cz ? Object.fromEntries(Object.entries(h.cz).map(([k,v])=>[CAUSE[k].t,v])) : null,
    precision_1a_mitad:h.dec1, precision_2a_mitad:h.dec2,
    pieza_problematica:h.worstPiece?{pieza:nameOf(h.worstPiece.id), perdida_promedio:r1(h.worstPiece.avg), usos:h.worstPiece.n}:null}));
  const worst=[]; hist.forEach(h=>(h.log||[]).forEach((x,k)=>{ if(!x.sw && x.loss>CUT.buena) worst.push({h,x,k}); }));
  worst.sort((a,b)=>b.x.loss-a.x.loss);
  const peores=worst.slice(0,12).map(({h,x,k})=>({partida:h.date, jugada_n:k+1, medible:eligible(h), tablero_antes:rows(x.b),
    bandeja:x.t?x.t.map(nameOf):null, pieza_jugada:nameOf(x.p), tu_jugada:{fila:x.pos[0],col:x.pos[1]},
    sugerida:{pieza:nameOf(x.bp), fila:x.bpos[0], col:x.bpos[1]}, perdida:x.loss, calificacion:CAT[x.cat].t,
    causas:(x.tg||[]).map(t=>CAUSE[t].t), con_pista:!!x.h}));
  const data={
    generado:new Date().toISOString(), juego:'Bloque Eterno (tablero 8×8, piezas sin rotación)',
    definiciones:{
      calificaciones_por_perdida:{Óptima:`≤ ${CUT.optima}`, Buena:`≤ ${CUT.buena}`, Imprecisa:`≤ ${CUT.imprecisa}`, Error:`> ${CUT.imprecisa}`},
      puntaje_global:'0 a 100: Decisiones 50% (precisión promedio), Supervivencia 20% (vidas salvadas cada 30 jugadas), Orden 15%, Salud del tablero 15%. Los puntos del juego no entran.',
      vida_salvada:'momento en que el juego real habría terminado (ninguna pieza entraba) y se cambiaron piezas para seguir',
      puntos_por_vida:'puntos de la partida divididos por la cantidad de vidas (rescates + 1); la última vida no terminó en derrota sino porque el jugador cerró la partida',
      causas:Object.fromEntries(Object.values(CAUSE).map(c=>[c.t, c.tip])),
      costo_cada_100:'suma de pérdidas atribuidas a una causa, cada 100 jugadas (tope 32 por jugada, salvo en Te trabaste la bandeja)'
    },
    piezas:ACTIVE.map(s=>({nombre:s.name, frecuencia_pct:+(100*wOf(s)/W_TOT).toFixed(1), forma:shape(s)})),
    coach: st.ready ? {foco_actual:CAUSE[coach.focus].t, desde:coach.since, costo_base_cada_100:r1(coach.base),
        seguimiento: st.prog ? {partidas:st.prog.games, costo_actual_cada_100:r1(st.prog.cur)} : null,
        ranking:st.rank.map(r=>({falencia:CAUSE[r.k].t, costo_cada_100:r1(r.v), jugadas:r.cnt})), errores_sin_causa_clara:st.R.otro,
        focos_superados:coach.done.map(d=>({falencia:CAUSE[d.k].t, desde:d.from, hasta:d.to, base:d.base, final:d.end}))}
      : {listo:false, partidas_medibles:st.E.length, jugadas_medibles:st.moves, minimo:COACH_MIN},
    patrones_de_decision: (()=>{ const P=findPatterns(st.E); return {jugadas:P.M.length, error_general_pct:P.all.err,
      hallazgos:P.out.map(o=>({texto:o.t.replace(/<[^>]+>/g,''), casos:o.n})), cortes:P.cuts}; })(),
    partidas, peores_jugadas:peores
  };
  return `# Bloque Eterno · reporte para el coach\n\nPegá este archivo completo en una conversación con Claude. Tiene dos partes: las instrucciones para Claude y tus datos.\n\n## Instrucciones para Claude\n\n${PROMPT}\n\n## Datos\n\n\`\`\`json\n${JSON.stringify(data,null,1)}\n\`\`\`\n`;
}
$('#repCopy').addEventListener('click',()=>{

  const ok=()=>{ $('#repBox').hidden=true; $('#cMsg').textContent=`Reporte copiado (${kb} KB). Pegalo en una conversación nueva con Claude.`; };

// ---------- Registro de errores sin causa clara (persistente: no se borra al borrar el historial) ----------
// Guarda lo mínimo; las métricas se calculan al exportar, así se pueden recalcular con un motor nuevo.
let unclear = readJSON(LS.unclear, []);
const UNCLEAR_MAX = 400;
function logUnclear(g){
  if(!(g.cv>=3) || !g.log) return;
  const have=new Set(unclear.map(u=>u.id)); let added=false;
  g.log.forEach((x,k)=>{
    if(x.sw || (x.tg&&x.tg.length) || x.loss<=CUT.buena || !x.t) return;

  if(!cands.length) return {val:health(o)-DEAD*pieces.length, moves:pieces.map(s=>({pieza:s.name, sin_lugar:true})), o, lines:0};

function focusContext(f, P){
  const T=P.M.filter(m=>m.tg.includes(f)); if(T.length<3) return '';
  const lleno=pct(T.filter(m=>m.fill>=.55).length,T.length), llenoG=pct(P.M.filter(m=>m.fill>=.55).length,P.M.length);
  const first=pct(T.filter(m=>m.pick===1).length,T.length), firstG=pct(P.M.filter(m=>m.pick===1).length,P.M.length);
  return `<span class="note"><b>Cuándo te pasa</b> (${T.length} casos): el ${lleno}% con el tablero lleno (en general, ${llenoG}% de tus jugadas) y el ${first}% con la primera pieza de la tanda (en general, ${firstG}%).</span>`;
}
function patternsBlock(P){
  if(P.M.length<60) return `<div class="patterns"><h3>Por qué: tus patrones de decisión</h3><p class="empty">Con 60 jugadas medibles o más aparecen tus patrones: con qué tablero, con qué pieza y en qué momento de la tanda te equivocás (vas ${P.M.length}).</p></div>`;
  const items=P.out.slice(0,6).map(o=>`<li>${o.t}${o.n<30?' <span class="tag unk">indicio</span>':''}</li>`).join('') || '<li>Por ahora no aparece ningún patrón marcado: tus errores están repartidos parejo.</li>';
  return `<div class="patterns"><h3>Por qué: tus patrones de decisión</h3><ul>${items}</ul><p class="foot">Sobre ${P.M.length} jugadas medibles, error general ${P.all.err}%. “Indicio”: menos de 30 casos, tomalo con pinzas.</p></div>`;
}

// ---------- Línea de color: fila o columna completa de un solo tono ----------
const HUE=SHAPES.map(s=>{
  const n=parseInt(s.col.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn; let h=0;
  if(d){ h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; if(h<0) h+=360; }
  return h<20||h>=330 ? 0 : h<60 ? 1 : h<160 ? 2 : h<200 ? 3 : h<250 ? 4 : 5;   // rojo, naranja, verde, celeste, azul, violeta
});
function monoLines(){
  let n=0;
  const same=idx=> idx.every(i=>board[i]!=null) && idx.every(i=>HUE[board[i]]===HUE[board[idx[0]]]);
  for(let i=0;i<N;i++){ const row=[], col=[]; for(let j=0;j<N;j++){ row.push(i*N+j); col.push(j*N+i); }
    if(same(row)) n++; if(same(col)) n++; }
  return n;
}
// Racha: jugadas seguidas rompiendo al menos una línea
function extraPoints(res, hits){
  if(res.n){ streak++; bestStreak=Math.max(bestStreak,streak); } else streak=0;
  colorLines+=hits;
  if(album && mode==='eterno'){ album.lines+=res.n; album.color+=hits; album.placed++; album.best=Math.max(album.best,streak); }
  if(!BONUS_MODES.includes(mode) || !res.n) return {pts:0, label:''};
  const pr = streak>=2 ? 10*(streak-1) : 0, pc = 40*hits;
  return {pts:pr+pc, label:[streak>=2?`racha x${streak}`:'', hits?'¡color!':''].filter(Boolean).join(' · ')};
}

// Te trabaste (Survival y Duelo)
function modeStuck(idx){
  if(mode==='survival'){
    lives--; X.lifePts.push(score-X.mark); X.mark=score;
    if(lives<=0){ survivalOver(); return; }
    const ch=swapForExit(idx); rescued=new Set(ch);

  } else {
    // Duelo: la misma regla que se le aplica al motor, para que sea parejo
    X.lost++; idx.forEach(i=>tray[i]=DOT); rescued=new Set(idx);
    const k=stuckPenalty(X.ts, score-X.ts.sc); score-=k.pen; X.pen=(X.pen||0)+k.pen;
    log(k.unavoidable ? 'Te trabaste, pero con ese tablero y esas piezas el motor también se trababa: perdés la vida sin descuento.'
      : `Te trabaste: −${k.pen} pts. Con esa bandeja el motor sumaba ${k.ref} y vos llevabas ${k.ref-k.pen}. Esas piezas pasan a ser Puntos.`);

  }
}

// ---------- Duelo contra el motor ----------
function seedRng(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pickWith(R){ const tot=ACTIVE.reduce((a,s)=>a+wOf(s),0); let x=R()*tot; for(const s of ACTIVE){ x-=wOf(s); if(x<=0) return s; } return ACTIVE[0]; }
const DUEL_N=20;
const todayKey=()=>{ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); };
let duelKind=store.get('be-duelkind')==='free' ? 'free' : 'daily';
const dailyAll=()=>readJSON('be-daily',{});
function dailyRec(){ return dailyAll()[todayKey()] || {tries:0, best:null, engine:null}; }
function saveDaily(r){ const all=dailyAll(); all[todayKey()]=r; store.set('be-daily', JSON.stringify(all)); }
function duelInit(seed){
  const sd = seed ?? (duelKind==='daily' ? todayKey() : (Math.random()*2**31)|0);
  const R=seedRng(sd);
  X.kind=duelKind; X.seed=sd; X.N=DUEL_N; X.setIdx=0; X.lost=0; X.pm=0; X.done=false;
  X.seq=[...Array(DUEL_N)].map(()=>[pickWith(R),pickWith(R),pickWith(R)].map(s=>s.id));
  X.eng={b:Array(64).fill(null), set:0, rest:[], score:0, lost:0, moves:0};
  if(duelKind==='daily'){ const d=dailyRec(); d.tries++; saveDaily(d); }
}
function duelNextSet(){
  const ids=X.seq[X.setIdx++];
  X.ts={b:board.map(v=>v==null?0:1), ids, sc:score};      // foto al empezar la tanda: referencia para el descuento
  return ids.map(id=>BY_ID[id]);
}
// Puntos que suma el mejor plan del motor con una bandeja (misma búsqueda que el motor) y si alguna pieza queda sin lugar
function planPts(o, pieces){
  if(!pieces.length) return {val:health(o), pts:0, dead:0};
  const cands=[], seen=new Set();
  pieces.forEach((s,i)=>{ if(seen.has(s.id)) return; seen.add(s.id); const rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){ if(!fits(o,s,r,c)) continue;
      const p=placeO(o,s,r,c); cands.push({o:p.o, n:p.n, s, rest, q:p.n*LW+health(p.o)}); } });
  if(!cands.length) return {val:health(o)-DEAD*pieces.length, pts:0, dead:pieces.length};
  cands.sort((a,b)=>b.q-a.q); let best=null;
  for(const x of cands.slice(0,BEAM)){ const sub=planPts(x.o,x.rest), v=x.n*LW+sub.val;
    if(!best || v>best.val) best={val:v, pts:x.s.cells.length+x.n*10*x.n+sub.pts, dead:sub.dead}; }
  return best;
}
// Descuento al trabarse: lo que el motor sumaba con esa bandeja desde el tablero inicial, menos lo que sumaste vos.
// Si el motor también se trababa con ese tablero y esas piezas, la vida no se podía salvar y no se descuenta nada.
function stuckPenalty(ts, made){
  const ref=planPts(Uint8Array.from(ts.b), ts.ids.map(id=>BY_ID[id]));
  return {pen: ref.dead ? 0 : Math.max(0, ref.pts-made), ref:ref.pts, unavoidable:!!ref.dead};
}
function engineStep(){
  const e=X.eng; if(e.moves>=X.N*3) return;
  if(!e.rest.length){ const ids=X.seq[e.set++]; e.rest=ids.slice(); e.ts={b:e.b.map(v=>v==null?0:1), ids, sc:e.score}; }
  const o=new Uint8Array(64); e.b.forEach((v,i)=>o[i]=v==null?0:1);
  let P=e.rest.map(id=>BY_ID[id]);
  if(!P.some(s=>anyFit(o,s))){ e.lost++; const k=stuckPenalty(e.ts, e.score-e.ts.sc); e.score-=k.pen; e.pen=(e.pen||0)+k.pen; e.rest=e.rest.map(()=>'dot'); P=e.rest.map(id=>BY_ID[id]); }
  const A=analyze(o, P.map((s,i)=>({i,s}))), s=P[A.best.slot], [r,c]=A.best.pos, res=placeO(o,s,r,c);
  s.cells.forEach(([a,b])=>e.b[(r+a)*N+c+b]=s.k); res.cleared.forEach(k=>e.b[k]=null);
  e.score+=s.cells.length+res.n*10*res.n; e.moves++; e.rest.splice(A.best.slot,1);
}
// El motor juega una jugada por cada jugada tuya, un instante después (así lo ves avanzar)
let engTimer=0;
function duelAfterMove(){

}

function duelCheckEnd(){

    <div class="kpis">
      <div class="kpi"><b>${score}</b><span>Tus puntos</span></div>
      <div class="kpi"><b>${e.score}</b><span>Puntos del motor</span></div>
      <div class="kpi"><b>${X.lost}</b><span>Tus vidas perdidas</span></div>
      <div class="kpi"><b>${e.lost}</b><span>Vidas perdidas del motor</span></div>
      <div class="kpi"><b>${X.pen?'−'+X.pen:0}</b><span>Tu descuento por trabarte</span></div>
      <div class="kpi"><b>${e.pen?'−'+e.pen:0}</b><span>Descuento del motor</span></div>
      <div class="kpi wide"><b>${diff>0?'+':''}${diff}</b><span>Diferencia${rec?' · '+rec:''}</span></div>
    </div>
    <p class="foot">Las mismas tandas para los dos y la misma regla al trabarse: perdés una vida, esas piezas pasan a ser Puntos y se descuenta lo que el motor sumaba con esa bandeja desde el tablero inicial menos lo que habías sumado. Si el motor también se trababa, no hay descuento. Los puntos ya incluyen los descuentos.</p>
    <div class="tools"><button type="button" id="again" class="primary">Revancha con las mismas piezas</button>${X.kind==='free'?'<button type="button" id="newDuel">Duelo nuevo</button>':''}</div>`,
    ()=>{ const seed=X.seed;
      $('#again').addEventListener('click',()=>{ closeBalance(); startGame('duelo', seed); });
      const nd=$('#newDuel'); if(nd) nd.addEventListener('click',()=>{ closeBalance(); startGame('duelo'); }); });

// ---------- Puzzles: dejá el tablero limpio ----------
let pz=readJSON('be-puzzle',{level:1, solved:0});
const PERMS=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
// Se arma al revés: se eligen las líneas a limpiar y 3 piezas que caen dentro de ellas; el tablero es
// el resto de esas líneas. Después se verifica que exista un orden que deje el tablero vacío.
function genPuzzle(level){
  const nl=Math.min(5, 2+Math.floor((level-1)/3));          // de 2 líneas a 5 según el nivel
  for(let t=0;t<600;t++){
    const L=new Set(); while(L.size<nl){ L.add((Math.random()<.5?'r':'c')+Math.floor(Math.random()*8)); }
    const inL=new Uint8Array(64), lineCells=[];
    for(const l of L){ const k=+l.slice(1), cells=[]; for(let j=0;j<8;j++){ const i=l[0]==='r'?k*8+j:j*8+k; inL[i]=1; cells.push(i); } lineCells.push(cells); }
    const usedC=new Uint8Array(64), sol=[]; let ok=true;
    for(let p=0;p<3 && ok;p++){
      let placed=false;
      for(let a=0;a<40 && !placed;a++){
        const s=pickWeighted(); if(s.id==='dot') continue;
        const opts=[];
        for(let r=0;r<=8-s.h;r++) for(let c=0;c<=8-s.w;c++) if(s.cells.every(([y,x])=>{ const i=(r+y)*8+c+x; return inL[i]&&!usedC[i]; })) opts.push([r,c]);
        if(opts.length){ const [r,c]=opts[Math.floor(Math.random()*opts.length)]; s.cells.forEach(([y,x])=>usedC[(r+y)*8+c+x]=1); sol.push([s.id,r,c]); placed=true; }
      }
      if(!placed) ok=false;
    }
    if(!ok) continue;
    if(!lineCells.every(cells=>cells.some(i=>usedC[i]))) continue;     // ninguna línea puede arrancar completa
    const start=new Uint8Array(64); for(let i=0;i<64;i++) start[i]=inL[i]&&!usedC[i]?1:0;
    let full=false; for(let i=0;i<8&&!full;i++){ let rf=1,cf=1; for(let j=0;j<8;j++){ if(!start[i*8+j]) rf=0; if(!start[j*8+i]) cf=0; } full=!!(rf||cf); }
    if(full) continue;                                                    // ninguna línea completa al arrancar
    let good=null;
    for(const pm of PERMS){ let o=start.slice(), okp=true;
      for(const k of pm){ const [id,r,c]=sol[k], s=BY_ID[id]; if(!fits(o,s,r,c)){ okp=false; break; } o=placeO(o,s,r,c).o; }
      if(okp && o.every(v=>!v)){ good=pm.map(k=>sol[k]); break; } }
    if(!good) continue;
    const tr=sol.map(x=>x[0]).sort(()=>Math.random()-.5);              // la bandeja no delata el orden
    return {start:[...start], tray:tr, sol:good};
  }
  return null;
}
function puzzleLoad(){
  const p=genPuzzle(pz.level) || genPuzzle(1);
  X.level=pz.level; X.tries=1; X.hints=0; X.p=p;
  board=p.start.map(v=>v?PZ_COLOR:null); tray=p.tray.map(id=>BY_ID[id]); used=[false,false,false];
}
function puzzleReset(){
  board=X.p.start.map(v=>v?PZ_COLOR:null); tray=X.p.tray.map(id=>BY_ID[id]); used=[false,false,false]; X.tries++; X.over=false; flash=null;
  renderTray(); render(); saveState(); log('De nuevo desde el principio.');
}
function puzzleAfter(){
  const empty=board.every(v=>v==null), left=[0,1,2].filter(i=>!used[i]);
  if(!left.length && empty){
    X.over=true; pz.level++; pz.solved++; store.set('be-puzzle', JSON.stringify(pz));
    const cb=$('#combo'); cb.textContent='¡Limpio!'; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show');
    log(`¡Resuelto${X.tries===1?' al primer intento':` en ${X.tries} intentos`}! Va el nivel ${pz.level}.`);
    setTimeout(()=>{ if(mode==='puzzle') startGame('puzzle'); },1100);
    return;
  }
  const o=occ(board);
  if(!left.length || !left.some(i=>anyFit(o,tray[i]))){
    X.over=true; log(left.length ? 'No entra la pieza que queda: así no se limpia. Tocá “Reintentar”.' : 'No quedó limpio. Probá otro orden o lugar: tocá “Reintentar”.');
  }
}
$('#pzRetry').addEventListener('click',()=>{ if(mode==='puzzle') puzzleReset(); });
$('#pzSkip').addEventListener('click',()=>{ if(mode==='puzzle'){ startGame('puzzle'); log(`Otro puzzle del nivel ${pz.level}.`); } });
$('#pzHint').addEventListener('click',()=>{
  if(mode!=='puzzle') return;
  if(used.some(Boolean)) puzzleReset();
  const [id,r,c]=X.p.sol[0]; X.hints++;
  flash=cellsOf(BY_ID[id],r,c); render();
  log(`Pista: arrancá con la pieza ${nameOf(id)} en el lugar marcado.`);
  clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ flash=null; render(); },2200);
});

// ---------- Sesión álbum (en Eterno): ponés una duración y al final te da el resumen ----------
let album=null, albumTimer=0;
$('#album').addEventListener('change',()=>{
  const m=+$('#album').value; clearInterval(albumTimer);
  if(!m){ album=null; $('#albumLeft').textContent=''; return; }
  album={min:m, start:Date.now(), end:Date.now()+m*60e3, lines:0, color:0, placed:0, best:0, pts:0};
  tickAlbum(); albumTimer=setInterval(tickAlbum,1000);
  log(`Sesión de ${m} minutos: seguí jugando tranquilo, al final te muestro el resumen.`);
});
function tickAlbum(){
  if(!album) return;
  const left=album.end-Date.now();
  if(left<=0){ endAlbum(); return; }
  $('#albumLeft').textContent=`Quedan ${Math.floor(left/60e3)}:${String(Math.floor(left%60e3/1000)).padStart(2,'0')}`;
}
function endAlbum(){
  clearInterval(albumTimer); const a=album; album=null; $('#album').value='0'; $('#albumLeft').textContent='';
  if(!a) return;
  showSheet(`<div class="bal-top"><div><h2 id="balTitle">Fin de la sesión</h2><div class="bal-date">${a.min} minutos</div></div><button type="button" id="closeBal" class="ghost">Cerrar</button></div>
    <div class="global"><div><div class="big">${a.lines}</div><div class="lbl">Líneas rotas</div></div><div class="side"><b>${a.pts} pts</b><span class="lbl">Puntos en la sesión</span></div></div>
    <div class="kpis">
      <div class="kpi"><b>${a.placed}</b><span>Piezas colocadas</span></div>
      <div class="kpi"><b>${a.best}</b><span>Mejor racha</span></div>
      <div class="kpi"><b>${a.color}</b><span>Líneas de color</span></div>
      <div class="kpi"><b>${a.placed?(a.lines/a.placed*10).toFixed(1):'0'}</b><span>Líneas cada 10 piezas</span></div>
    </div>`);
}

// ---------- Survival: vidas arriba y boosters que se compran con tus puntos ----------
// El precio sube ×1,5 cada vez que comprás el mismo booster en la partida (si no, el martillo te deja sin riesgo).
const BOOST={
  future:{t:'Ver el futuro',      base:60,  d:'Ves la próxima tanda durante 3 tandas.'},
  hammer:{t:'Martillo de colores', base:120, d:'Tocá un bloque: se borran todos los de ese color. 1 punto por bloque.'},
  mult:  {t:'Multiplicador',       base:150, d:'x2 durante 5 jugadas. Cada jugada que rompe 2 o más líneas lo sube: x4, x6, x8.'},
  served:{t:'Piezas servidas',     base:250, d:'El motor te sirve piezas para hacer combos: lo que queda de esta tanda y la siguiente.'},
};
let servedIdx=new Set();
const price=k=>Math.round(BOOST[k].base*Math.pow(1.5,(X.bought&&X.bought[k])||0));
const randIds=()=>[pickWeighted(),pickWeighted(),pickWeighted()].map(s=>s.id);
// Reparto del Survival: hay una cola de tandas (para poder mostrar la próxima con "Ver el futuro")
function survivalSet(){
  if(X.served>0){ X.served--; const s=servedPieces(3); servedIdx=new Set([0,1,2]); return s; }
  servedIdx=new Set();
  X.queue=X.queue||[]; while(X.queue.length<2) X.queue.push(randIds());
  if(X.fut>0) X.fut--;
  return X.queue.shift().map(id=>BY_ID[id]);
}
// Piezas servidas: el motor busca, una por una, la pieza que en el tablero actual rompe más líneas
function servedPieces(k){
  let o=occ(board); const out=[];
  for(let n=0;n<k;n++){
    let best=null;
    for(const s of ACTIVE){ if(s.id==='dot') continue;
      for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){ if(!fits(o,s,r,c)) continue;
        const p=placeO(o,s,r,c), q=p.n*100+health(p.o);
        if(!best || q>best.q) best={s,o:p.o,q}; } }
    if(best){ out.push(best.s); o=best.o; } else out.push(DOT);
  }
  return out;
}
function buyBoost(k){
  if(mode!=='survival' || X.over) return;
  const p=price(k);
  if(score<p){ log(`Te faltan ${p-score} puntos para ${BOOST[k].t}.`); return; }
  if(k==='mult' && X.mult){ log('Ya tenés el multiplicador activo.'); return; }
  if(k==='served' && X.served>0){ log('Ya tenés piezas servidas en camino.'); return; }
  if(k==='hammer' && X.hammer){ X.hammer=false; flash=null; render(); log('Martillo guardado.'); return; }
  score-=p; X.bought=X.bought||{}; X.bought[k]=(X.bought[k]||0)+1; X.spent=(X.spent||0)+p; X.used=(X.used||0)+1;
  if(k==='future'){ X.fut=(X.fut||0)+3; log('Ver el futuro: abajo de la bandeja ves la próxima tanda.'); }
  if(k==='mult'){ X.mult={x:2,left:5}; log('Multiplicador x2 por 5 jugadas. Rompé 2 o más líneas juntas para subirlo.'); }
  if(k==='hammer'){ X.hammer=true; log('Martillo listo: tocá un bloque del tablero y se borra todo ese color.'); }
  if(k==='served'){
    const idx=[0,1,2].filter(i=>!used[i]), s=servedPieces(idx.length);
    idx.forEach((i,j)=>tray[i]=s[j]); servedIdx=new Set(idx); X.served=1;
    log('Piezas servidas: esta bandeja y la próxima vienen armadas para romper líneas.');
  }
  renderTray(); render(); saveState();
}
// Multiplicador: se aplica a todo lo que sumó la jugada
function boostAfterMove(res, gained){
  const m=X.mult; if(!m) return;
  if(res.n>=2) m.x=Math.min(8,m.x+2);
  const extra=gained*(m.x-1); score+=extra;
  if(extra){ const cb=$('#combo'); cb.textContent=`x${m.x} · +${gained+extra}`; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show'); }
  if(--m.left<=0){ X.mult=null; log(`Se terminó el multiplicador (llegó a x${m.x}).`); }
}
// Martillo: se elige el color tocando un bloque
function cellAt(e){
  const br=boardEl.getBoundingClientRect(), cs=cellSize();
  const c=Math.floor((e.clientX-br.left-6)/(cs+3)), r=Math.floor((e.clientY-br.top-6)/(cs+3));
  return r>=0&&r<N&&c>=0&&c<N ? r*N+c : -1;
}
const sameHue=g=>new Set(board.map((v,i)=>v!=null&&HUE[v]===g?i:-1).filter(i=>i>=0));
boardEl.addEventListener('pointermove',e=>{ if(mode!=='survival'||!X.hammer||drag) return; const i=cellAt(e); flash = i>=0&&board[i]!=null ? sameHue(HUE[board[i]]) : null; render(); });
boardEl.addEventListener('pointerdown',e=>{
  if(mode!=='survival' || !X.hammer || drag || drill) return;
  const i=cellAt(e); if(i<0 || board[i]==null) return;
  e.preventDefault(); hammerAt(i);
});
function hammerAt(i){
  const cells=[...sameHue(HUE[board[i]])], popped=cells.map(k=>[k,SHAPES[board[k]].col]);
  cells.forEach(k=>board[k]=null); score+=cells.length; X.hammer=false; flash=null;
  const cb=$('#combo'); cb.textContent=`¡Martillazo! +${cells.length}`; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show');
  popAnim(popped); log(`Borraste ${cells.length} bloques de ese color.`);
  if(score>best){ best=score; store.set(bestKey(mode),best); }
  renderTray(); render(); saveState();
}
function renderSurv(){
  const on=mode==='survival';
  $('#livesTop').hidden=!on; $('#rowSurv').hidden=!on || !!drill;
  if(!on){ $('#nextBox').hidden=true; return; }
  $('#livesTop').innerHTML=[0,1,2].map(k=>`<span class="heart${k<lives?'':' off'}" aria-hidden="true">♥</span>`).join('')+`<span class="sr">${lives} vidas</span>`;
  document.querySelectorAll('#rowSurv [data-b]').forEach(b=>{
    const k=b.dataset.b, p=price(k), active=(k==='mult'&&X.mult)||(k==='served'&&X.served>0)||(k==='hammer'&&X.hammer);
    b.querySelector('small').textContent = k==='hammer'&&X.hammer ? 'tocá un bloque' : active ? 'activo' : `${p} pts`;
    b.disabled = X.over || (!(k==='hammer'&&X.hammer) && (score<p || active));
    b.classList.toggle('on', !!active);
  });
  const st=[]; if(X.mult) st.push(`Multiplicador x${X.mult.x} · ${X.mult.left} ${X.mult.left===1?'jugada':'jugadas'}`);
  if(X.fut>0) st.push(`Futuro: ${X.fut} ${X.fut===1?'tanda':'tandas'}`); if(X.served>0) st.push('Próxima tanda servida');
  $('#boostInfo').textContent=st.join(' · ');
  const nb=$('#nextBox'); nb.hidden=!(X.fut>0);
  if(X.fut>0){
    if(X.served>0) nb.innerHTML='<span class="fl">Próxima tanda</span><span class="foot">La sirve el motor</span>';
    else { X.queue=X.queue||[]; while(X.queue.length<1) X.queue.push(randIds());
      nb.innerHTML='<span class="fl">Próxima tanda</span>'+X.queue[0].map(id=>{ const s=BY_ID[id];
        return `<div class="mini" style="grid-template-columns:repeat(${s.w},10px);grid-template-rows:repeat(${s.h},10px)">${s.cells.map(([r,c])=>`<i class="blk" style="--col:${s.col};grid-row:${r+1};grid-column:${c+1}"></i>`).join('')}</div>`; }).join(''); }
  }
}
document.querySelectorAll('#rowSurv [data-b]').forEach(b=>b.addEventListener('click',()=>buyBoost(b.dataset.b)));

buildBoard();
if(loadState()){ syncModeUI(); runAnalysis(); renderTray(); render(); log(mode==='tutor'?`Seguís tu partida del tutor (${game.moves.length} jugadas).`:'Seguís tu partida.'); }
else startGame('eterno');
renderHist();
renderCoach();
})();
</script>
