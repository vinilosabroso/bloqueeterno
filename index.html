<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloque Eterno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: una sola columna tipo app móvil — marcador, tablero 8x8, bandeja de 3 piezas, panel del algoritmo */
:root{
  --bg:#1b2a6b; --bg2:#24378a; --board:#121c4d; --cell:#1a2660; --line:#2c3c86;
  --fg:#f2f5ff; --muted:#a9b6ea; --gold:#ffcf3f; --ok:#5fe08a; --warn:#ff8a5c;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg));color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.5px;line-height:1}
h1 small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
.scores{display:flex;gap:14px;text-align:right}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.score.best b{color:var(--gold)}
#board{position:relative;width:100%;aspect-ratio:1;max-width:100%;background:var(--board);border-radius:12px;padding:6px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:3px;box-shadow:inset 0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.35)}
.c{border-radius:5px;background:var(--cell);position:relative}
.blk{background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),inset 3px 0 0 rgba(255,255,255,.12)}
.c.ghost{background:var(--col);opacity:.45}
.c.hint{box-shadow:inset 0 0 0 2px var(--gold)}
.c.pop{animation:pop .32s ease-out forwards}
@keyframes pop{0%{transform:scale(1);filter:brightness(1.8)}100%{transform:scale(.2);opacity:0}}
#combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2.2rem;color:var(--gold);
  text-shadow:0 3px 0 #a35a00;pointer-events:none;opacity:0}
#combo.show{animation:cb .9s ease-out}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:120px}
.slot{background:rgba(255,255,255,.06);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:120px;position:relative;touch-action:none;cursor:grab}
.slot.rescued{box-shadow:0 0 0 2px var(--warn)}
.slot.rescued::after{content:"rescate";position:absolute;top:6px;right:8px;font-size:.62rem;color:var(--warn);text-transform:uppercase;letter-spacing:1px;font-weight:800}
.mini{display:grid;gap:2px}
.mini i{display:block;border-radius:3px}
#drag{position:fixed;left:0;top:0;pointer-events:none;display:grid;gap:3px;z-index:20;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#drag i{border-radius:5px;display:block}
.panel{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
label.tg{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer}
select,button{font:inherit;font-size:.85rem;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.log{font-size:.78rem;color:var(--muted);min-height:1.2em}
@media (prefers-reduced-motion:reduce){.c.pop,#combo.show{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Bloque Eterno<small>8×8 · nunca te quedás sin jugada</small></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>Puntos</span></div>
      <div class="score best"><b id="best">0</b><span>Récord</span></div>
    </div>
  </header>

  <div id="board"><div id="combo"></div></div>
  <div class="tray" id="tray"></div>

  <div class="panel">
    <div class="row">
      <label class="tg" for="mode">Algoritmo
        <select id="mode">
          <option value="assist" selected>Asistido (busca la pieza justa)</option>
          <option value="safe">Solo seguro (aleatorio pero resoluble)</option>
        </select>
      </label>
      <button id="reset" type="button">Reiniciar</button>
    </div>
    <div class="row">
      <label class="tg" for="hints"><input type="checkbox" id="hints"> Marcar dónde encaja</label>
      <div class="stats"><span>Tandas <b id="sets">0</b></span><span>Rescates <b id="resc">0</b></span><span>Líneas <b id="lines">0</b></span></div>
    </div>
    <div class="log" id="log">Arrastrá una pieza al tablero.</div>
  </div>
</div>
<div id="drag" hidden></div>

<script>
(() => {
const N = 8;
// Piezas de la captura (fila, columna). Sin rotación, como en el original.
const SHAPES = [
  {id:'S-v',  col:'#3fcf4e', cells:[[0,1],[1,0],[1,1],[2,0]]},
  {id:'Z-h',  col:'#2ec4ea', cells:[[0,0],[0,1],[1,1],[1,2]]},
  {id:'I3-h', col:'#ffad1f', cells:[[0,0],[0,1],[0,2]]},
  {id:'diag', col:'#9b4fe0', cells:[[0,0],[1,1],[2,2]]},
  {id:'J',    col:'#e8333f', cells:[[0,0],[1,0],[1,1],[1,2]]},
  {id:'O2',   col:'#f2552c', cells:[[0,0],[0,1],[1,0],[1,1]]},
  {id:'dot',  col:'#ef3b36', cells:[[0,0]]},
  {id:'O3',   col:'#ffc21a', cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]},
  {id:'T',    col:'#a052e8', cells:[[0,1],[1,0],[1,1],[1,2]]},
  {id:'Z-v',  col:'#3a6ff0', cells:[[0,0],[1,0],[1,1],[2,1]]},
  {id:'I4-v', col:'#e22b3a', cells:[[0,0],[1,0],[2,0],[3,0]]},
  {id:'L',    col:'#3d64ee', cells:[[0,0],[1,0],[2,0],[2,1]]},
];
SHAPES.forEach(s=>{s.h=Math.max(...s.cells.map(c=>c[0]))+1; s.w=Math.max(...s.cells.map(c=>c[1]))+1;});
const DOT = SHAPES.find(s=>s.id==='dot');
// Peso base: las piezas chicas no deberían salir tanto, si no el juego es trivial
const WEIGHT = {'dot':0.5,'O3':0.8,'diag':0.8};

// ---------- Estado ----------
let board, tray, used, score, lines, sets, rescues, best = 0;
try { best = +localStorage.getItem('be-best') || 0; } catch(e){}

// ---------- Motor (tablero = Uint8Array de 64, 0 vacío / 1 ocupado) ----------
function occ(b){ const o=new Uint8Array(64); for(let i=0;i<64;i++) o[i]=b[i]?1:0; return o; }
function fits(o,s,r,c){
  if(r<0||c<0||r+s.h>N||c+s.w>N) return false;
  for(const [dr,dc] of s.cells) if(o[(r+dr)*N+c+dc]) return false;
  return true;
}
// Coloca y limpia filas/columnas completas. Devuelve {o, cleared:[índices], n:líneas}
function placeO(o,s,r,c){
  const n=o.slice(); for(const [dr,dc] of s.cells) n[(r+dr)*N+c+dc]=1;
  const clr=new Set(); let k=0;
  for(let i=0;i<N;i++){
    let rf=true, cf=true;
    for(let j=0;j<N;j++){ if(!n[i*N+j]) rf=false; if(!n[j*N+i]) cf=false; }
    if(rf){k++; for(let j=0;j<N;j++) clr.add(i*N+j);}
    if(cf){k++; for(let j=0;j<N;j++) clr.add(j*N+i);}
  }
  clr.forEach(i=>n[i]=0);
  return {o:n, cleared:[...clr], n:k};
}
function anyFit(o,s){ for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++) if(fits(o,s,r,c)) return true; return false; }

// ¿Existe algún orden y ubicación que permita colocar TODAS las piezas? (backtracking con presupuesto)
function solvable(o, pieces, budget={n:60000}){
  if(!pieces.length) return true;
  for(let i=0;i<pieces.length;i++){
    if(i>0 && pieces.slice(0,i).some(p=>p===pieces[i])) continue; // piezas repetidas: no reintentar
    const s=pieces[i], rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
      if(--budget.n<0) return false;           // si se agota, lo tomamos como "no seguro"
      if(!fits(o,s,r,c)) continue;
      if(solvable(placeO(o,s,r,c).o, rest, budget)) return true;
    }
  }
  return false;
}

// Puntaje de "pieza justa": mejor jugada inmediata (líneas que limpia + contacto con bloques)
function fitQuality(o,s){
  let best=-1;
  for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
    if(!fits(o,s,r,c)) continue;
    const res=placeO(o,s,r,c); let touch=0;
    for(const [dr,dc] of s.cells){
      const R=r+dr,C=c+dc;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const y=R+a,x=C+b; if(y<0||x<0||y>=N||x>=N||o[y*N+x]) touch++;});
    }
    const q=res.n*12 + touch/s.cells.length;
    if(q>best) best=q;
  }
  return best;
}

function pickWeighted(){
  const tot=SHAPES.reduce((a,s)=>a+(WEIGHT[s.id]||1),0); let x=Math.random()*tot;
  for(const s of SHAPES){ x-=(WEIGHT[s.id]||1); if(x<=0) return s; } return SHAPES[0];
}

// Genera la tanda de 3 piezas leyendo el tablero
function generateSet(){
  const o=occ(board), mode=$('#mode').value;
  const cands=[];
  for(let t=0;t<120 && cands.length<(mode==='assist'?10:1);t++){
    const set=[pickWeighted(),pickWeighted(),pickWeighted()];
    if(solvable(o,set)) cands.push(set);
  }
  if(!cands.length){
    // Tablero muy cargado: armamos la tanda pieza por pieza garantizando que siga siendo resoluble
    const set=[];
    for(let k=0;k<3;k++){
      const opts=[...SHAPES].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a));
      set.push(opts.find(s=>solvable(o,[...set,s])) || DOT);
    }
    log('Tablero apretado: tanda armada pieza por pieza.');
    return set;
  }
  if(mode==='safe') return cands[0];
  // Asistido: elegimos la tanda con mejores jugadas disponibles (con algo de azar para no ser obvio)
  let best=cands[0], bq=-1;
  for(const set of cands){
    const q=set.reduce((a,s)=>a+fitQuality(o,s),0) + Math.random()*4;
    if(q>bq){bq=q;best=set;}
  }
  return best;
}

// Después de cada jugada: si lo que queda en la bandeja ya no se puede colocar, se reemplaza
function rescue(){
  const o=occ(board);
  const idx=[0,1,2].filter(i=>!used[i]);
  if(!idx.length || solvable(o, idx.map(i=>tray[i]))) return;
  const order=[...SHAPES].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a));
  // Probar cambiando una sola pieza (la menor intervención posible)
  for(const i of idx){
    for(const s of order){
      const test=idx.map(j=>j===i?s:tray[j]);
      if(solvable(o,test)){ tray[i]=s; markRescue([i]); return; }
    }
  }
  // Si no alcanza, rearmar todo lo que queda
  const set=[];
  for(const i of idx){ const s=order.find(x=>solvable(o,[...set,x]))||DOT; set.push(s); tray[i]=s; }
  markRescue(idx);
}
function markRescue(list){
  rescues+=list.length; rescued=new Set(list);
  log(`Rescate: cambié ${list.length===1?'1 pieza':list.length+' piezas'} porque con lo que quedaba no había salida.`);
}

// ---------- UI ----------
const $=q=>document.querySelector(q);
const boardEl=$('#board'), trayEl=$('#tray'), dragEl=$('#drag');
let cellsEl=[], rescued=new Set();
function log(t){ $('#log').textContent=t; }

function buildBoard(){
  boardEl.querySelectorAll('.c').forEach(e=>e.remove());
  cellsEl=[];
  for(let i=0;i<64;i++){ const d=document.createElement('div'); d.className='c'; boardEl.insertBefore(d,$('#combo')); cellsEl.push(d); }
}
function render(preview){
  const hint = $('#hints').checked ? hintCells() : new Set();
  for(let i=0;i<64;i++){
    const e=cellsEl[i]; e.className='c'; e.style.removeProperty('--col');
    if(board[i]){ e.classList.add('blk'); e.style.setProperty('--col',board[i]); }
    else if(preview && preview.set.has(i)){ e.classList.add('ghost'); e.style.setProperty('--col',preview.col); }
    if(!board[i] && hint.has(i)) e.classList.add('hint');
  }
  $('#score').textContent=score; $('#best').textContent=best;
  $('#sets').textContent=sets; $('#resc').textContent=rescues; $('#lines').textContent=lines;
}
function hintCells(){
  // Marca una ubicación válida para cada pieza disponible (sirve para ver que siempre hay jugada)
  const o=occ(board), out=new Set();
  tray.forEach((s,i)=>{ if(used[i]) return;
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++) if(fits(o,s,r,c)){ s.cells.forEach(([a,b])=>out.add((r+a)*N+c+b)); return; }
  });
  return out;
}
function renderTray(){
  trayEl.innerHTML='';
  tray.forEach((s,i)=>{
    const slot=document.createElement('div'); slot.className='slot'+(rescued.has(i)&&!used[i]?' rescued':''); slot.dataset.i=i;
    if(!used[i]){
      const m=document.createElement('div'); m.className='mini';
      const sz=Math.min(18, Math.floor(100/Math.max(s.w,s.h,3)));
      m.style.gridTemplateColumns=`repeat(${s.w},${sz}px)`; m.style.gridTemplateRows=`repeat(${s.h},${sz}px)`;
      s.cells.forEach(([r,c])=>{ const b=document.createElement('i'); b.className='blk'; b.style.setProperty('--col',s.col); b.style.gridRow=r+1; b.style.gridColumn=c+1; m.appendChild(b); });
      slot.appendChild(m);
      slot.addEventListener('pointerdown',e=>startDrag(e,i));
    }
    trayEl.appendChild(slot);
  });
}

// ---------- Arrastre ----------
let drag=null;
function cellSize(){ const r=boardEl.getBoundingClientRect(); return (r.width-12-3*7)/8; }
function startDrag(e,i){
  e.preventDefault();
  const s=tray[i], cs=cellSize();
  dragEl.innerHTML=''; dragEl.style.gridTemplateColumns=`repeat(${s.w},${cs}px)`; dragEl.style.gridTemplateRows=`repeat(${s.h},${cs}px)`;
  s.cells.forEach(([r,c])=>{ const b=document.createElement('i'); b.className='blk'; b.style.setProperty('--col',s.col); b.style.gridRow=r+1; b.style.gridColumn=c+1; dragEl.appendChild(b); });
  dragEl.hidden=false;
  const lift = e.pointerType==='touch' ? 90 : 30; // levantamos la pieza para que el dedo no la tape
  drag={i,s,cs,lift,pos:null};
  trayEl.children[i].style.opacity=.25;
  moveDrag(e);
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag,{once:true});
  window.addEventListener('pointercancel',endDrag,{once:true});
}
function moveDrag(e){
  if(!drag) return;
  const {s,cs,lift}=drag, W=s.w*cs+(s.w-1)*3, H=s.h*cs+(s.h-1)*3;
  const x=e.clientX-W/2, y=e.clientY-H-lift+cs/2;
  dragEl.style.transform=`translate(${x}px,${y}px)`;
  const br=boardEl.getBoundingClientRect();
  const c=Math.round((x-br.left-6)/(cs+3)), r=Math.round((y-br.top-6)/(cs+3));
  const o=occ(board);
  if(fits(o,s,r,c)){
    drag.pos=[r,c];
    render({set:new Set(s.cells.map(([a,b])=>(r+a)*N+c+b)), col:s.col});
  } else { drag.pos=null; render(); }
}
function endDrag(){
  window.removeEventListener('pointermove',moveDrag);
  dragEl.hidden=true;
  const d=drag; drag=null; if(!d) return;
  if(d.pos) commit(d.i,d.pos[0],d.pos[1]);
  else { renderTray(); render(); }
}

function commit(i,r,c){
  const s=tray[i];
  const res=placeO(occ(board),s,r,c);
  for(const [a,b] of s.cells) board[(r+a)*N+c+b]=s.col;
  used[i]=true; rescued.delete(i);
  score+=s.cells.length;
  if(res.n){
    lines+=res.n; const pts=res.n*10*res.n; score+=pts;
    res.cleared.forEach(k=>{ cellsEl[k].classList.add('pop'); });
    const cb=$('#combo'); cb.textContent=res.n>1?`¡x${res.n}! +${pts}`:`+${pts}`; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show');
    render();
    res.cleared.forEach(k=>{ cellsEl[k].classList.add('pop'); });
    setTimeout(()=>{ res.cleared.forEach(k=>board[k]=null); after(); },300);
  } else after();
}
function after(){
  if(score>best){ best=score; try{localStorage.setItem('be-best',best);}catch(e){} }
  if(used.every(Boolean)) newSet(); else rescue();
  renderTray(); render();
}
function newSet(){ tray=generateSet(); used=[false,false,false]; rescued=new Set(); sets++; }

function reset(){
  board=new Array(64).fill(null); score=0; lines=0; sets=0; rescues=0;
  newSet(); renderTray(); render(); log('Arrastrá una pieza al tablero.');
}
$('#reset').addEventListener('click',reset);
$('#hints').addEventListener('change',()=>render());
$('#mode').addEventListener('change',()=>log($('#mode').value==='assist'
  ? 'Asistido: entre varias tandas posibles, elige la que mejor encaja en tu tablero.'
  : 'Solo seguro: tanda al azar, solo se garantiza que se pueda colocar.'));

buildBoard(); reset();
})();
</script>
</body>
</html>
