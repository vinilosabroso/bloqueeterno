<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bloque Eterno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: una columna tipo app móvil — marcador, tablero 8x8, bandeja, panel de juego, historial; el balance abre como hoja superpuesta */
:root{
  --bg:#1b2a6b; --bg2:#24378a; --board:#121c4d; --cell:#1a2660; --line:#2c3c86; --sheet:#16215a;
  --fg:#f2f5ff; --muted:#a9b6ea; --gold:#ffcf3f;
  --c-opt:#4fe08a; --c-good:#9fd94a; --c-imp:#ffb547; --c-err:#ff6b6b;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,Segoe UI,sans-serif;
  color-scheme:dark;
}
/* Reset propio: fuera de Claude (GitHub Pages) no hay uno por defecto */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:radial-gradient(120% 60% at 50% 0%,var(--bg2),var(--bg)) fixed,var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden;min-height:100vh}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 32px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:0;letter-spacing:.5px;line-height:1}
h1 small{display:block;font-family:var(--body);font-size:.72rem;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-top:4px}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;letter-spacing:.3px}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);margin:0;font-weight:800}
.scores{display:flex;gap:14px;text-align:right}
.score b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.score.best b{color:var(--gold)}

#board{position:relative;width:100%;aspect-ratio:1;max-width:100%;background:var(--board);border-radius:12px;padding:6px;
  display:grid;grid-template-columns:repeat(8,1fr);gap:3px;box-shadow:inset 0 0 0 2px var(--line),0 10px 30px rgba(0,0,0,.35)}
.c{border-radius:5px;background:var(--cell);position:relative}
.blk{background:var(--col);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),inset 3px 0 0 rgba(255,255,255,.12)}
.c.ghost{background:var(--col);opacity:.45}
/* Vista previa de ruptura: las líneas que se romperían toman el color de la pieza y "respiran" el brillo */
.c.pre{--col:var(--pcol);background:var(--pcol);opacity:1;animation:breathe .9s ease-in-out infinite}
.c.pre.blk,.c.pre.ghost{box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35),0 0 8px var(--pcol)}
@keyframes breathe{0%,100%{filter:brightness(1.05)}50%{filter:brightness(.5)}}
.c.hint{box-shadow:inset 0 0 0 2px var(--gold)}
.c.best{outline:2px dashed var(--gold);outline-offset:-3px}
.c.missed{outline:2px dashed var(--c-opt);outline-offset:-3px}
.c.fx{position:absolute;pointer-events:none;z-index:2}
.c.pop{animation:pop .32s ease-out forwards}
body.dragging{touch-action:none;overscroll-behavior:none}
@keyframes pop{0%{transform:scale(1);filter:brightness(1.8)}100%{transform:scale(.2);opacity:0}}
#combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--display);font-size:2.2rem;color:var(--gold);
  text-shadow:0 3px 0 #a35a00;pointer-events:none;opacity:0;z-index:3}
#combo.show{animation:cb .9s ease-out}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#fb{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;pointer-events:none;white-space:nowrap;
  background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:800;
  display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .2s}
#fb.show{opacity:1}
#fb .tag{color:var(--k)}
#fb .why{color:var(--muted);font-weight:600}

.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot{background:rgba(255,255,255,.06);border-radius:12px;display:flex;align-items:center;justify-content:center;min-height:112px;position:relative;touch-action:none;cursor:grab}
.slot .badge{position:absolute;top:6px;right:8px;font-size:.62rem;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.slot.rescued{box-shadow:0 0 0 2px var(--c-imp)}
.slot.rescued .badge{color:var(--c-imp)}
.slot.first{box-shadow:0 0 0 2px var(--gold)}
.slot.first .badge{color:var(--gold)}
.mini{display:grid;gap:2px}
.mini i{display:block;border-radius:3px}
#drag{position:fixed;left:0;top:0;pointer-events:none;display:grid;gap:3px;z-index:20;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#drag i{border-radius:5px;display:block}

.panel{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}
label.tg{display:flex;gap:8px;align-items:center;font-size:.85rem;cursor:pointer}
select,button,textarea{font:inherit;font-size:.85rem;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select,button{cursor:pointer}
button.primary{background:var(--gold);color:#3a2600;border-color:var(--gold);font-weight:800}
button.ghost{background:transparent}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:inline-flex;background:var(--board);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:800;padding:6px 12px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--bg2);color:var(--fg)}
.log{font-size:.78rem;color:var(--muted);min-height:1.2em}

/* Historial */
.hist{display:flex;flex-direction:column;gap:12px}
.hist-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.empty{font-size:.85rem;color:var(--muted);line-height:1.5}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.patterns{display:flex;flex-direction:column;gap:6px;font-size:.84rem;line-height:1.45}
.patterns li{list-style:none;padding-left:14px;position:relative}
.patterns li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:2px;background:var(--gold)}
.patterns ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
th{font-size:.64rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);text-align:right;font-weight:800;padding:6px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 6px;text-align:right;border-top:1px solid var(--line)}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.04)}
.gpill{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:800;background:var(--board)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
#impBox{display:flex;flex-direction:column;gap:8px}
#impBox textarea{width:100%;min-height:80px;font-size:.75rem;user-select:text;-webkit-user-select:text}

/* Balance (hoja superpuesta) */
#sheetWrap{position:fixed;inset:0;z-index:30;background:rgba(5,10,35,.66);display:flex;align-items:flex-end;justify-content:center;
  padding-top:max(24px,env(safe-area-inset-top,0px))}
#sheet{background:var(--sheet);width:100%;max-width:480px;max-height:100%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@media (min-width:560px){#sheetWrap{align-items:center} #sheet{border-radius:18px;max-height:92%}}
.bal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bal-date{font-size:.75rem;color:var(--muted)}
.global{display:flex;align-items:flex-end;gap:16px}
.global .big{font-family:var(--display);font-size:3.4rem;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}
.global .lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
.global .side{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.global .side b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.delta{font-size:.78rem;font-weight:800}
.delta.up{color:var(--c-opt)} .delta.down{color:var(--c-err)}
.subs{display:grid;grid-template-columns:1fr;gap:9px}
.sub{display:grid;grid-template-columns:132px 1fr 30px;align-items:center;gap:10px;font-size:.82rem}
.sub .bar{height:8px;border-radius:5px;background:var(--board);overflow:hidden}
.sub .bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
.sub b{text-align:right;font-variant-numeric:tabular-nums}
.sub small{color:var(--muted);font-size:.7rem}
.dist{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--board)}
.dist i{display:block;height:100%}
.dist-l{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:8px}
.dist-l b{color:var(--fg)}
.dist-l i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--board);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:.72rem;color:var(--muted);line-height:1.3}
.kpi.wide{grid-column:1/-1}
.replay{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rb{display:flex;flex-direction:column;gap:6px;min-width:0}
.rb span{font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.mb{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--board);padding:4px;border-radius:8px;aspect-ratio:1;max-width:100%}
.mb i{display:block;border-radius:2px;background:var(--cell)}
.mb i.on{background:var(--col)}
.mb i.you{background:var(--c-err);box-shadow:0 0 0 1px #fff inset}
.mb i.opt{background:var(--c-opt);box-shadow:0 0 0 1px #fff inset}
.note{font-size:.84rem;line-height:1.5;color:var(--fg)}
.note em{font-style:normal;color:var(--gold)}
.foot{font-size:.72rem;color:var(--muted);line-height:1.45}
@media (prefers-reduced-motion:reduce){.c.pop,#combo.show,.c.pre{animation:none} .c.pre{filter:brightness(.7)} #fb{transition:none}}
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Bloque Eterno<small id="sub">8×8 · nunca te quedás sin jugada</small></h1>
    <div class="scores">
      <div class="score"><b id="score">0</b><span>Puntos</span></div>
      <div class="score best"><b id="best">0</b><span>Récord</span></div>
    </div>
  </header>

  <div id="board"><div id="combo"></div><div id="fb"></div></div>
  <div class="tray" id="tray"></div>

  <div class="panel">
    <div class="row">
      <div class="seg" role="group" aria-label="Modo de juego">
        <button type="button" id="mEterno" aria-pressed="true">Eterno</button>
        <button type="button" id="mTutor" aria-pressed="false">Tutor</button>
      </div>
      <button id="reset" type="button" class="ghost">Nueva partida</button>
    </div>
    <div class="row" id="rowEterno">
      <label class="tg" for="hints"><input type="checkbox" id="hints"> Marcar dónde encaja</label>
    </div>
    <div class="row" id="rowTutor" hidden>
      <label class="tg" for="live"><input type="checkbox" id="live" checked> Pistas en vivo</label>
      <button id="finish" type="button" class="primary">Terminar y ver balance</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="log" id="log">Arrastrá una pieza al tablero.</div>
  </div>

  <section class="panel hist" aria-labelledby="hTitle">
    <div class="hist-head"><h2 id="hTitle">Historial del tutor</h2><span class="bal-date" id="hCount"></span></div>
    <div id="hBody"></div>
    <div class="tools">
      <button type="button" id="hCopy">Copiar historial</button>
      <button type="button" id="hImp">Importar</button>
      <button type="button" id="hDel" class="ghost">Borrar historial</button>
    </div>
    <div id="impBox" hidden>
      <label for="impText" class="foot">Pegá acá un historial copiado desde otro dispositivo. Se suma al actual sin duplicar partidas.</label>
      <textarea id="impText"></textarea>
      <div class="tools"><button type="button" id="impGo" class="primary">Sumar al historial</button><button type="button" id="impCancel" class="ghost">Cancelar</button></div>
    </div>
    <div id="delBox" class="row" hidden>
      <span class="foot">¿Borrar todas las partidas guardadas en este dispositivo?</span>
      <div class="tools"><button type="button" id="delYes">Sí, borrar</button><button type="button" id="delNo" class="ghost">No</button></div>
    </div>
    <p class="foot" id="hMsg"></p>
  </section>
</div>
<div id="drag" hidden></div>
<div id="sheetWrap" hidden><div id="sheet" role="dialog" aria-modal="true" aria-labelledby="balTitle"></div></div>

<script>
(() => {
// ENGINE START
const N = 8;
// Piezas de la captura (fila, columna). Sin rotación, como en el original.
const SHAPES = [
  {id:'S-v',  name:'S vertical',    col:'#3fcf4e', cells:[[0,1],[1,0],[1,1],[2,0]]},
  {id:'Z-h',  name:'Z horizontal',  col:'#2ec4ea', cells:[[0,0],[0,1],[1,1],[1,2]]},
  {id:'I3-h', name:'Barra de 3',    col:'#ffad1f', cells:[[0,0],[0,1],[0,2]]},
  {id:'diag', name:'Diagonal',      col:'#9b4fe0', cells:[[0,0],[1,1],[2,2]]},
  {id:'J',    name:'J',             col:'#e8333f', cells:[[0,0],[1,0],[1,1],[1,2]]},
  {id:'O2',   name:'Cuadrado 2×2',  col:'#f2552c', cells:[[0,0],[0,1],[1,0],[1,1]]},
  {id:'dot',  name:'Punto',         col:'#ef3b36', cells:[[0,0]]},
  {id:'O3',   name:'Cuadrado 3×3',  col:'#ffc21a', cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]]},
  {id:'T',    name:'T',             col:'#a052e8', cells:[[0,1],[1,0],[1,1],[1,2]]},
  {id:'Z-v',  name:'Z vertical',    col:'#3a6ff0', cells:[[0,0],[1,0],[1,1],[2,1]]},
  {id:'I4-v', name:'Barra de 4',    col:'#e22b3a', cells:[[0,0],[1,0],[2,0],[3,0]]},
  {id:'L',    name:'L',             col:'#3d64ee', cells:[[0,0],[1,0],[2,0],[2,1]]},
];
SHAPES.forEach((s,k)=>{ s.k=k; s.h=Math.max(...s.cells.map(c=>c[0]))+1; s.w=Math.max(...s.cells.map(c=>c[1]))+1; });
const BY_ID = Object.fromEntries(SHAPES.map(s=>[s.id,s]));
const DOT = BY_ID['dot'], O3 = BY_ID['O3'];
// Peso de aparición: las piezas chicas no deberían salir tanto, si no el juego es trivial
const WEIGHT = {'dot':0.5,'O3':0.8,'diag':0.8};

// Tablero lógico para el motor: Uint8Array(64), 0 vacío / 1 ocupado
function fits(o,s,r,c){
  if(r<0||c<0||r+s.h>N||c+s.w>N) return false;
  for(const [dr,dc] of s.cells) if(o[(r+dr)*N+c+dc]) return false;
  return true;
}
// Coloca y limpia filas/columnas completas. Devuelve {o, cleared:[índices], n:líneas}
function placeO(o,s,r,c){
  const n=o.slice(); for(const [dr,dc] of s.cells) n[(r+dr)*N+c+dc]=1;
  const clr=new Set(); let k=0;
  for(let i=0;i<N;i++){
    let rf=true, cf=true;
    for(let j=0;j<N;j++){ if(!n[i*N+j]) rf=false; if(!n[j*N+i]) cf=false; }
    if(rf){k++; for(let j=0;j<N;j++) clr.add(i*N+j);}
    if(cf){k++; for(let j=0;j<N;j++) clr.add(j*N+i);}
  }
  clr.forEach(i=>n[i]=0);
  return {o:n, cleared:[...clr], n:k};
}
function anyFit(o,s){ for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++) if(fits(o,s,r,c)) return true; return false; }

// ¿Existe algún orden y ubicación que permita colocar TODAS las piezas? (backtracking con presupuesto)
function solvable(o, pieces, budget={n:60000}){
  if(!pieces.length) return true;
  for(let i=0;i<pieces.length;i++){
    if(i>0 && pieces.slice(0,i).some(p=>p===pieces[i])) continue;
    const s=pieces[i], rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
      if(--budget.n<0) return false;
      if(!fits(o,s,r,c)) continue;
      if(solvable(placeO(o,s,r,c).o, rest, budget)) return true;
    }
  }
  return false;
}

// ---------- Evaluación (tutor) ----------
// Hueco aislado: celda vacía rodeada por bloques o bordes. Solo entra el Punto.
function holes(o){
  let h=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c; if(o[i]) continue;
    if((r===0||o[i-N]) && (r===N-1||o[i+N]) && (c===0||o[i-1]) && (c===N-1||o[i+1])) h++;
  }
  return h;
}
// Salud del tablero: más alto = mejor. Premia espacio libre y lugar para el 3×3;
// castiga huecos aislados y bordes irregulares (cambios lleno/vacío entre vecinos).
const HW = {empty:0.6, hole:4, trans:0.5, room3:6};
function health(o){
  let empty=0, trans=0;
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const i=r*N+c, v=o[i];
    if(!v) empty++;
    if(c<N-1 && v!==o[i+1]) trans++;
    if(r<N-1 && v!==o[i+N]) trans++;
  }
  return empty*HW.empty - holes(o)*HW.hole - trans*HW.trans + (anyFit(o,O3)?HW.room3:0);
}
const LW = 8;      // valor de cada línea limpiada
const DEAD = 40;   // castigo por cada pieza de la tanda que queda sin lugar
const BEAM = 5;    // cuántas continuaciones explora en profundidad

// Mejor resultado alcanzable colocando el resto de la tanda (cualquier orden).
// Solo usa lo que el jugador podía ver: tablero + piezas de la tanda. Nada del futuro.
function bestSeq(o, pieces){
  if(!pieces.length) return health(o);
  const cands=[], seen=new Set();
  pieces.forEach((s,i)=>{
    if(seen.has(s.id)) return; seen.add(s.id);
    const rest=pieces.filter((_,j)=>j!==i);
    for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
      if(!fits(o,s,r,c)) continue;
      const p=placeO(o,s,r,c);
      cands.push({o:p.o, n:p.n, rest, q:p.n*LW+health(p.o)});
    }
  });
  if(!cands.length) return health(o) - DEAD*pieces.length;
  cands.sort((a,b)=>b.q-a.q);
  let best=-Infinity;
  for(let k=0;k<Math.min(BEAM,cands.length);k++){
    const x=cands[k]; const v=x.n*LW + bestSeq(x.o, x.rest);
    if(v>best) best=v;
  }
  return best;
}
// Analiza el turno: valor de cada (pieza, posición) posible ahora mismo.
// slots: [{i, s}] piezas disponibles en la bandeja.
function analyze(o, slots){
  const per={}, memo={}; let best={val:-Infinity};
  for(const {i,s} of slots){
    if(memo[s.id]){ per[i]=memo[s.id]; }
    else{
      const rest=slots.filter(x=>x.i!==i).map(x=>x.s);
      const table=new Map(); let bp=null, bv=-Infinity;
      for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
        if(!fits(o,s,r,c)) continue;
        const p=placeO(o,s,r,c); const v=p.n*LW + bestSeq(p.o, rest);
        table.set(r*N+c, v); if(v>bv){bv=v; bp=[r,c];}
      }
      per[i]=memo[s.id]={table, bestPos:bp, bestVal:bv};
    }
    if(per[i].bestVal>best.val) best={val:per[i].bestVal, slot:i, pos:per[i].bestPos};
  }
  return {per, best, nSlots:slots.length};
}
// Umbrales de pérdida (diferencia contra la mejor jugada posible)
const CUT = {optima:0.5, buena:4, imprecisa:10};
function judge(A, i, r, c){
  const e=A.per[i], user=e.table.get(r*N+c);
  const loss=Math.max(0, A.best.val-user), posLoss=Math.max(0, e.bestVal-user), orderLoss=Math.max(0, A.best.val-e.bestVal);
  const cat = loss<=CUT.optima?'optima' : loss<=CUT.buena?'buena' : loss<=CUT.imprecisa?'imprecisa' : 'error';
  // Error de orden: la pérdida viene principalmente de haber elegido esta pieza primero
  const orderErr = A.nSlots>1 && cat!=='optima' && orderLoss>CUT.buena && orderLoss>=posLoss;
  return {loss, posLoss, orderLoss, cat, orderErr, acc:100*Math.exp(-loss/12)};
}

  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

function occ(b){ const o=new Uint8Array(64); for(let i=0;i<64;i++) o[i]=b[i]==null?0:1; return o; }
function pickWeighted(){
  const tot=SHAPES.reduce((a,s)=>a+(WEIGHT[s.id]||1),0); let x=Math.random()*tot;
  for(const s of SHAPES){ x-=(WEIGHT[s.id]||1); if(x<=0) return s; } return SHAPES[0];
}
// Calidad de la mejor jugada inmediata de una pieza (lo usa el modo Eterno para elegir la "pieza justa")
function fitQuality(o,s){
  let q=-1;
  for(let r=0;r<=N-s.h;r++) for(let c=0;c<=N-s.w;c++){
    if(!fits(o,s,r,c)) continue;
    const res=placeO(o,s,r,c); let touch=0;
    for(const [dr,dc] of s.cells){ const R=r+dr,C=c+dc;
      for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){ const y=R+a,x=C+b; if(y<0||x<0||y>=N||x>=N||o[y*N+x]) touch++; } }
    q=Math.max(q, res.n*12 + touch/s.cells.length);
  }
  return q;
}

// ---------- Reparto de piezas ----------
function generateSet(){
  const o=occ(board);
  if(mode==='tutor') return [pickWeighted(),pickWeighted(),pickWeighted()];  // tandas reales, como el juego original
  const cands=[];
  for(let t=0;t<120 && cands.length<10;t++){ const set=[pickWeighted(),pickWeighted(),pickWeighted()]; if(solvable(o,set)) cands.push(set); }
  if(!cands.length){
    const set=[];
    for(let k=0;k<3;k++){ const opts=[...SHAPES].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a)); set.push(opts.find(s=>solvable(o,[...set,s]))||DOT); }
    return set;
  }
  let pick=cands[0], bq=-1;
  for(const set of cands){ const q=set.reduce((a,s)=>a+fitQuality(o,s),0)+Math.random()*4; if(q>bq){bq=q;pick=set;} }
  return pick;
}
// Cambia piezas de la bandeja para que vuelva a haber salida (con la menor intervención posible)
function swapForExit(idx){
  const o=occ(board), order=[...SHAPES].sort((a,b)=>fitQuality(o,b)-fitQuality(o,a));
  for(const i of idx) for(const s of order){
    if(solvable(o, idx.map(j=>j===i?s:tray[j]))){ tray[i]=s; return [i]; }
  }
  const set=[]; for(const i of idx){ const s=order.find(x=>solvable(o,[...set,x]))||DOT; set.push(s); tray[i]=s; }
  return idx;
}
let rescued=new Set();
function checkRescue(){
  const o=occ(board), idx=[0,1,2].filter(i=>!used[i]);
  if(!idx.length) return;
  if(mode==='eterno'){
    // Eterno: interviene apenas el resto de la tanda deja de tener salida completa
    if(solvable(o, idx.map(i=>tray[i]))) return;
    const ch=swapForExit(idx); rescues+=ch.length; rescued=new Set(ch);
    log(`Rescate: cambié ${ch.length===1?'1 pieza':ch.length+' piezas'} porque con lo que quedaba no había salida.`);
  } else {
    // Tutor: interviene solo cuando el juego real terminaría (ninguna pieza entra en ningún lado)
    if(idx.some(i=>anyFit(o,tray[i]))) return;
    const ch=swapForExit(idx); saves++; rescued=new Set(ch);
    game.saves=saves;
    log('Vida salvada: acá el juego real terminaba. Te cambié piezas para que sigas.');
  }
}

function hintCells(){

  });

}

function runAnalysis(){

}
const cellsOf=(s,r,c)=>new Set(s.cells.map(([a,b])=>(r+a)*N+c+b));

// ---------- Arrastre ----------
let drag=null;
function cellSize(){ const r=boardEl.getBoundingClientRect(); return (r.width-12-3*7)/8; }
function startDrag(e,i){
  e.preventDefault();
  if(drag) return;
  const s=tray[i], cs=cellSize();
  dragEl.innerHTML=''; dragEl.style.gridTemplateColumns=`repeat(${s.w},${cs}px)`; dragEl.style.gridTemplateRows=`repeat(${s.h},${cs}px)`;
  s.cells.forEach(([r,c])=>{ const b=document.createElement('i'); b.className='blk'; b.style.setProperty('--col',s.col); b.style.gridRow=r+1; b.style.gridColumn=c+1; dragEl.appendChild(b); });
  dragEl.hidden=false;
  const lift = e.pointerType==='touch' ? 90 : 30;   // la pieza va por encima del dedo
  const bestSet = live() && analysis && analysis.per[i] && analysis.per[i].bestPos ? cellsOf(s,...analysis.per[i].bestPos) : null;
  drag={i,s,cs,lift,pos:null,id:e.pointerId,bestSet};
  flash=null;
  trayEl.children[i].style.opacity=.25;
  document.body.classList.add('dragging');
  moveDrag(e);
  window.addEventListener('pointermove',moveDrag);
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
}
function moveDrag(e){
  if(!drag || e.pointerId!==drag.id) return;
  const {s,cs,lift}=drag, W=s.w*cs+(s.w-1)*3, H=s.h*cs+(s.h-1)*3;
  const x=e.clientX-W/2, y=e.clientY-H-lift+cs/2;
  dragEl.style.transform=`translate(${x}px,${y}px)`;
  const br=boardEl.getBoundingClientRect();
  const c=Math.round((x-br.left-6)/(cs+3)), r=Math.round((y-br.top-6)/(cs+3));
  const o=occ(board);
  if(fits(o,s,r,c)){
    drag.pos=[r,c];
    // Qué filas/columnas se romperían si la soltás acá
    const pre=new Set(placeO(o,s,r,c).cleared);
    render({set:cellsOf(s,r,c), col:s.col, best:drag.bestSet, pre});
  }
  else { drag.pos=null; render({set:new Set(), best:drag.bestSet}); }
}
function endDrag(e){
  if(!drag || (e && e.pointerId!==drag.id)) return;
  window.removeEventListener('pointermove',moveDrag);
  window.removeEventListener('pointerup',endDrag);
  window.removeEventListener('pointercancel',endDrag);
  document.body.classList.remove('dragging');
  dragEl.hidden=true;
  const d=drag; drag=null;
  if(e.type==='pointerup' && d.pos && fits(occ(board),d.s,d.pos[0],d.pos[1])) commit(d.i,d.pos[0],d.pos[1]);
  else { renderTray(); render(); }
}

// ---------- Jugada ----------
const CAT = {
  optima:{t:'Óptima',k:'var(--c-opt)'}, buena:{t:'Buena',k:'var(--c-good)'},
  imprecisa:{t:'Imprecisa',k:'var(--c-imp)'}, error:{t:'Error',k:'var(--c-err)'}
};
let fbTimer=0, flashTimer=0;
function feedback(j, s){
  const fb=$('#fb'); const c=CAT[j.cat];
  let why='';
  if(j.cat!=='optima') why = j.orderErr ? 'convenía empezar por otra pieza' : 'había un lugar mejor';
  fb.innerHTML=`<span class="tag" style="--k:${c.k}">${c.t}</span>${why?`<span class="why">${why}</span>`:''}`;
  fb.classList.add('show'); clearTimeout(fbTimer); fbTimer=setTimeout(()=>fb.classList.remove('show'),1800);
}
function commit(i,r,c){
  const s=tray[i];
  const before=occ(board);
  // Evaluación del tutor ANTES de cambiar el tablero
  let verdict=null;
  if(mode==='tutor'){
    if(!analysis) runAnalysis();
    verdict=judge(analysis,i,r,c);
  }
  const beforeStr = mode==='tutor' ? encodeBoard() : '';
  const res=placeO(before,s,r,c);
  for(const [a,b] of s.cells) board[(r+a)*N+c+b]=s.k;
  const popped=res.cleared.map(k=>[k,SHAPES[board[k]].col]);
  res.cleared.forEach(k=>board[k]=null);          // se limpia al instante; la animación va aparte
  const wasSwapped=rescued.has(i);
  used[i]=true; rescued.delete(i);
  score+=s.cells.length;
  if(res.n){
    lines+=res.n; const pts=res.n*10*res.n; score+=pts;
    const cb=$('#combo'); cb.textContent=res.n>1?`¡x${res.n}! +${pts}`:`+${pts}`; cb.classList.remove('show'); void cb.offsetWidth; cb.classList.add('show');
  }
  if(verdict) recordMove(verdict, s, i, r, c, before, res, beforeStr, wasSwapped);
  after();
  popAnim(popped);
}
function recordMove(v, s, i, r, c, before, res, beforeStr, swapped){
  const after=res.o, nAfter=after.reduce((a,x)=>a+x,0);
  const mv={p:s.id, loss:+v.loss.toFixed(2), cat:v.cat, ord:v.orderErr?1:0, acc:+v.acc.toFixed(1),
    holes:Math.max(0, holes(after)-holes(before)), no3:anyFit(after,O3)?0:1, fill:nAfter, sw:swapped?1:0};
  game.moves.push(mv);
  // Peor jugada: guardamos la foto del tablero para poder repetirla en el balance
  if(!game.worst || v.loss>game.worst.loss){
    const b=analysis.best, bs=tray[b.slot];
    game.worst={loss:v.loss, board:beforeStr, p:s.id, pos:[r,c], bp:bs.id, bpos:b.pos, ord:v.orderErr?1:0, n:game.moves.length};
  }
  if(live()){
    feedback(v, s);
    // Si no fue óptima, marcamos un instante dónde iba la pieza
    if(v.cat!=='optima' && !v.orderErr && analysis.per[i].bestPos){
      flash=cellsOf(s,...analysis.per[i].bestPos);
      clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ flash=null; render(); },1400);
    }
  }
}
function popAnim(list){
  list.forEach(([k,col])=>{
    const cell=cellsEl[k], f=document.createElement('div');
    f.className='c blk fx pop'; f.style.setProperty('--col',col);
    f.style.left=cell.offsetLeft+'px'; f.style.top=cell.offsetTop+'px';
    f.style.width=cell.offsetWidth+'px'; f.style.height=cell.offsetHeight+'px';
    f.addEventListener('animationend',()=>f.remove());
    boardEl.appendChild(f); setTimeout(()=>f.remove(),600);
  });
}
function after(){
  if(score>best){ best=score; store.set(LS.best,best); }
  if(used.every(Boolean)) newSet(); else checkRescue();
  runAnalysis(); renderTray(); render(); saveState();
}
function newSet(){ tray=generateSet(); used=[false,false,false]; rescued=new Set(); sets++; checkRescue(); }
function encodeBoard(){ return board.map(v=>v==null?'.':String.fromCharCode(97+v)).join(''); }
function decodeBoard(str){ return [...str].map(ch=>ch==='.'?null:ch.charCodeAt(0)-97); }

// ---------- Partida y persistencia ----------

// ======================================================================
// Balance de la partida
// ======================================================================
// Puntaje global 0–100. No usa los puntos del juego: mide decisiones, no suerte con las tandas.
const WG = {dec:0.5, ord:0.15, sup:0.2, sal:0.15};
function summarize(g, pts, lns, sts){
  const m=g.moves, n=m.length;
  const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const cats={optima:0,buena:0,imprecisa:0,error:0}; m.forEach(x=>cats[x.cat]++);
  const ordErr=m.filter(x=>x.ord).length, holesC=m.reduce((a,x)=>a+x.holes,0), no3=m.filter(x=>x.no3).length;
  const dec=avg(m.map(x=>x.acc));
  const half=Math.floor(n/2), dec1=avg(m.slice(0,half).map(x=>x.acc)), dec2=avg(m.slice(half).map(x=>x.acc));
  const ord=100*(1-ordErr/n);
  const sup=Math.max(0, 100-25*(g.saves/(n/30)));            // cada vida salvada cada 30 jugadas resta 25
  const sal=50*(1-no3/n) + 50*Math.exp(-3*holesC/n);
  const global=WG.dec*dec + WG.ord*ord + WG.sup*sup + WG.sal*sal;
  // Pieza problemática: mayor pérdida promedio (con al menos 3 usos)
  // Las piezas que puso el rescate no cuentan: aparecen con el tablero ya trabado y no reflejan cómo manejás esa pieza.
  // La pérdida se topea en 20 para que una sola jugada desesperada no defina la pieza.
  const pc={}; m.filter(x=>!x.sw).forEach(x=>{ (pc[x.p]=pc[x.p]||{n:0,loss:0,bad:0}); pc[x.p].n++; pc[x.p].loss+=Math.min(20,x.loss); if(x.cat==='imprecisa'||x.cat==='error') pc[x.p].bad++; });
  let worstPiece=null; for(const [id,v] of Object.entries(pc)) if(v.n>=3 && (!worstPiece || v.loss/v.n>worstPiece.avg)) worstPiece={id,avg:v.loss/v.n,n:v.n,bad:v.bad};
  return {id:g.start, date:new Date().toISOString(), start:g.start, n, points:pts, lines:lns, sets:sts, saves:g.saves,
    global:+global.toFixed(1), dec:+dec.toFixed(1), ord:+ord.toFixed(1), sup:+sup.toFixed(1), sal:+sal.toFixed(1),
    dec1:+dec1.toFixed(1), dec2:+dec2.toFixed(1), cats, ordErr, holes:holesC, no3, worstPiece, pieces:pc, worst:g.worst};
}
function finishGame(){
  if(mode!=='tutor') return;
  if(game.moves.length<MIN_MOVES){
    log(`Hacen falta al menos ${MIN_MOVES} jugadas para armar un balance (vas ${game.moves.length}).`);
    return;
  }
  const s=summarize(game, score, lines, sets);
  hist=hist.filter(h=>h.id!==s.id); hist.push(s); saveHist();
  showBalance(s, true);
  startGame('tutor');
}
function saveHist(){ if(!store.set(LS.hist, JSON.stringify(hist))) $('#hMsg').textContent='No se pudo guardar el historial en este navegador (almacenamiento bloqueado).'; renderHist(); }

const dateTxt=iso=>{ const d=new Date(iso); return d.toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); };
const nameOf=id=>(BY_ID[id]||{name:id}).name;
function miniBoard(str, piece, pos, cls){
  const s=BY_ID[piece], mark=cellsOf(s,pos[0],pos[1]);
  const b=decodeBoard(str);
  return `<div class="mb">${b.map((v,i)=> mark.has(i) ? `<i class="${cls}"></i>` : v==null ? '<i></i>' : `<i class="on" style="--col:${SHAPES[v].col}"></i>`).join('')}</div>`;
}
function showBalance(s, fresh){
  const prev=hist.filter(h=>h.id!==s.id && h.date<s.date);
  const avgPrev=prev.length? prev.reduce((a,h)=>a+h.global,0)/prev.length : null;
  const d = avgPrev==null ? '' : (()=>{ const x=s.global-avgPrev; return `<span class="delta ${x>=0?'up':'down'}">${x>=0?'+':''}${x.toFixed(1)} vs tu promedio</span>`; })();
  const sub=(lbl,v,hint)=>`<div class="sub"><span>${lbl}<br><small>${hint}</small></span><div class="bar"><i style="width:${Math.max(2,v)}%"></i></div><b>${fmt(v)}</b></div>`;
  const c=s.cats, tot=s.n;
  const seg=(k)=>c[k]?`<i style="width:${100*c[k]/tot}%;background:${CAT[k].k}"></i>`:'';
  const legend=Object.keys(CAT).map(k=>`<span><i style="background:${CAT[k].k}"></i>${CAT[k].t} <b>${c[k]}</b></span>`).join('');
  const w=s.worst;
  let worstHtml='';
  if(w){
    const why = w.ord ? `El problema fue el orden: convenía arrancar con <em>${nameOf(w.bp)}</em>.` : `La <em>${nameOf(w.p)}</em> tenía un lugar mejor.`;
    worstHtml=`<div><h3>Peor jugada · nº ${w.n}</h3></div>
      <div class="replay">
        <div class="rb"><span>Lo que hiciste</span>${miniBoard(w.board,w.p,w.pos,'you')}</div>
        <div class="rb"><span>La mejor</span>${miniBoard(w.board,w.bp,w.bpos,'opt')}</div>
      </div>
      <p class="note">${why} Te costó ${w.loss.toFixed(1)} puntos de evaluación.</p>`;
  }
  const wp=s.worstPiece;
  const fatigue = s.dec2 < s.dec1-5 ? `Bajó en la 2ª mitad (${fmt(s.dec1)} → ${fmt(s.dec2)})` : s.dec2 > s.dec1+5 ? `Mejoró en la 2ª mitad (${fmt(s.dec1)} → ${fmt(s.dec2)})` : `Pareja en toda la partida (${fmt(s.dec1)} / ${fmt(s.dec2)})`;
  $('#sheet').innerHTML=`
    <div class="bal-top">
      <div><h2 id="balTitle">${fresh?'Balance de la partida':'Partida guardada'}</h2><div class="bal-date">${dateTxt(s.date)} · ${s.n} jugadas</div></div>
      <button type="button" id="closeBal" class="ghost">Cerrar</button>
    </div>
    <div class="global">
      <div><div class="big">${fmt(s.global)}</div><div class="lbl">Puntaje global</div></div>
      <div class="side"><b>${s.points} pts</b><span class="lbl">Puntos del juego</span>${d}</div>
    </div>
    <div class="subs">
      ${sub('Decisiones',s.dec,'precisión de cada jugada')}
      ${sub('Orden',s.ord,'elegir qué pieza va primero')}
      ${sub('Supervivencia',s.sup,'vidas salvadas por jugada')}
      ${sub('Salud del tablero',s.sal,'huecos y lugar para el 3×3')}
    </div>
    <div><h3>Jugadas</h3><div class="dist" style="margin-top:8px">${['optima','buena','imprecisa','error'].map(seg).join('')}</div><div class="dist-l">${legend}</div></div>
    <div class="kpis">
      <div class="kpi"><b>${s.saves}</b><span>Partidas que habrías perdido (vidas salvadas)</span></div>
      <div class="kpi"><b>${s.ordErr}</b><span>Errores de orden</span></div>
      <div class="kpi"><b>${s.holes}</b><span>Huecos aislados que dejaste</span></div>
      <div class="kpi"><b>${s.no3}</b><span>Jugadas que te dejaron sin lugar para el 3×3</span></div>
      <div class="kpi wide"><b>${wp?nameOf(wp.id):'—'}</b><span>${wp?`Pieza problemática: pierde ${wp.avg.toFixed(1)} en promedio, ${wp.bad} de ${wp.n} jugadas imprecisas o errores`:'Pieza problemática: ninguna se usó 3 veces o más'}</span></div>
      <div class="kpi wide"><b style="font-size:1.05rem">${fatigue}</b><span>Precisión: 1ª mitad vs 2ª mitad de la partida</span></div>
    </div>
    ${worstHtml}
    <p class="foot">Contexto: ${s.lines} líneas en ${s.sets} tandas. El global pondera Decisiones 50%, Supervivencia 20%, Orden 15% y Salud del tablero 15%; los puntos del juego no entran, por eso una partida con menos puntos puede puntuar mejor. Cada jugada se compara con la mejor posible usando solo lo que veías: el tablero y las piezas de esa tanda.</p>`;
  $('#sheetWrap').hidden=false;
  $('#closeBal').focus();
  $('#closeBal').addEventListener('click',closeBalance);
}
function closeBalance(){ $('#sheetWrap').hidden=true; }
$('#sheetWrap').addEventListener('click',e=>{ if(e.target.id==='sheetWrap') closeBalance(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#sheetWrap').hidden) closeBalance(); });

// ======================================================================
// Historial: tendencia, patrones y tabla
// ======================================================================
function renderHist(){
  const body=$('#hBody'), H=[...hist].sort((a,b)=>a.date<b.date?-1:1);
  $('#hCount').textContent = H.length ? `${H.length} ${H.length===1?'partida':'partidas'}` : '';
  if(!H.length){
    body.innerHTML=`<p class="empty">Todavía no hay partidas. Jugá en modo <b>Tutor</b> y tocá “Terminar y ver balance” (mínimo ${MIN_MOVES} jugadas). Cada partida queda guardada con fecha en este dispositivo.</p>`;
    return;
  }
  body.innerHTML = chartSVG(H.slice(-30)) + patternsHTML(H) + tableHTML([...H].reverse());
  body.querySelectorAll('tbody tr').forEach(tr=>{
    const open=()=>{ const s=hist.find(h=>h.id===tr.dataset.id); if(s) showBalance(s,false); };
    tr.addEventListener('click',open);
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  });
}
function chartSVG(H){
  const W=400, Hh=150, L=28, R=12, T=12, B=22, iw=W-L-R, ih=Hh-T-B;
  const x=i=> H.length===1 ? L+iw/2 : L+iw*i/(H.length-1);
  const y=v=> T+ih*(1-v/100);
  const line=(k,col,wid)=>{
    const pts=H.map((h,i)=>`${x(i).toFixed(1)},${y(h[k]).toFixed(1)}`);
    return `<polyline points="${pts.join(' ')}" fill="none" style="stroke:${col}" stroke-width="${wid}" stroke-linejoin="round" stroke-linecap="round"/>`+
      H.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h[k]).toFixed(1)}" r="${i===H.length-1?4:2.5}" style="fill:${col}"/>`).join('');
  };
  const grid=[0,50,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${v}</text>`).join('');
  const last=H[H.length-1];
  const lbl=`<text x="${x(0)}" y="${Hh-6}" font-size="10" style="fill:var(--muted)">${new Date(H[0].date).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</text>`+
    (H.length>1?`<text x="${x(H.length-1)}" y="${Hh-6}" font-size="10" text-anchor="end" style="fill:var(--muted)">${new Date(last.date).toLocaleDateString('es-AR',{day:'numeric',month:'short'})}</text>`:'');
  return `<div><h3>Tendencia · últimas ${H.length}</h3><div class="chart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Puntaje global y decisiones por partida">${grid}${line('dec','var(--muted)',1.5)}${line('global','var(--gold)',2.5)}${lbl}</svg></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>Global</span><span><i style="background:var(--muted)"></i>Decisiones</span></div></div>`;
}
function patternsHTML(H){
  const out=[], avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  if(H.length<3){ return `<div class="patterns"><h3>Patrones</h3><p class="empty">Con 3 partidas o más aparecen los patrones (tendencia, pieza problemática, cansancio, momento del día).</p></div>`; }
  // Tendencia: últimas 5 contra las 5 anteriores (o mitades si hay pocas)
  const k=Math.min(5, Math.floor(H.length/2)), rec=H.slice(-k), prv=H.slice(-2*k,-k);
  const dt=avg(rec.map(h=>h.global))-avg(prv.map(h=>h.global));
  out.push(Math.abs(dt)<2 ? `Estable: tus últimas ${k} partidas promedian casi lo mismo que las ${k} anteriores (${fmt(avg(rec.map(h=>h.global)))}).`
    : `${dt>0?'Mejorando':'Bajando'}: tus últimas ${k} partidas promedian ${fmt(avg(rec.map(h=>h.global)))} de global, ${dt>0?'+':''}${dt.toFixed(1)} contra las ${k} anteriores.`);
  // Pieza problemática acumulada
  const agg={}; H.forEach(h=>Object.entries(h.pieces||{}).forEach(([id,v])=>{ (agg[id]=agg[id]||{n:0,loss:0}); agg[id].n+=v.n; agg[id].loss+=v.loss; }));
  const ranked=Object.entries(agg).filter(([,v])=>v.n>=8).map(([id,v])=>({id,avg:v.loss/v.n,n:v.n})).sort((a,b)=>b.avg-a.avg);
  if(ranked.length>=2) out.push(`Tu pieza más difícil es la <b>${nameOf(ranked[0].id)}</b> (pierde ${ranked[0].avg.toFixed(1)} por jugada en ${ranked[0].n} usos); la que mejor manejás es la ${nameOf(ranked[ranked.length-1].id)}.`);
  // Cansancio: ¿la precisión cae en la segunda mitad?
  const drops=H.filter(h=>h.dec2<h.dec1-5).length;
  out.push(drops>=H.length/2 ? `En ${drops} de ${H.length} partidas tu precisión cae en la segunda mitad: probablemente te conviene cortar antes o bajar el ritmo.`
    : `Tu precisión no suele caer al final de la partida (${drops} de ${H.length} con caída).`);
  // Momento del día
  const fr=h=>{ const t=new Date(h.date).getHours(); return t<6?'madrugada':t<12?'mañana':t<19?'tarde':'noche'; };
  const by={}; H.forEach(h=>{ (by[fr(h)]=by[fr(h)]||[]).push(h.global); });
  const fs=Object.entries(by).filter(([,v])=>v.length>=2).map(([f,v])=>({f,a:avg(v),n:v.length})).sort((a,b)=>b.a-a.a);
  if(fs.length>=2) out.push(`Jugás mejor a la ${fs[0].f} (${fmt(fs[0].a)} de global) que a la ${fs[fs.length-1].f} (${fmt(fs[fs.length-1].a)}).`);
  // Errores de orden recurrentes
  const ordRate=avg(H.map(h=>h.ordErr/h.n))*100;
  if(ordRate>=8) out.push(`El ${fmt(ordRate)}% de tus jugadas tiene error de orden: antes de mover, mirá las tres piezas y empezá por la más difícil de ubicar.`);
  return `<div class="patterns"><h3>Patrones</h3><ul>${out.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
}
function tableHTML(H){
  const col=v=>v>=80?'var(--c-opt)':v>=65?'var(--c-good)':v>=50?'var(--c-imp)':'var(--c-err)';
  const rows=H.map(h=>{ const d=new Date(h.date);
    return `<tr tabindex="0" data-id="${h.id}"><td>${d.toLocaleDateString('es-AR',{day:'numeric',month:'short'})} ${d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}</td>
      <td><span class="gpill" style="color:${col(h.global)}">${fmt(h.global)}</span></td><td>${fmt(h.dec)}</td><td>${h.points}</td><td>${h.saves}</td><td>${h.n}</td></tr>`; }).join('');
  return `<div><h3>Partidas · tocá una para ver su balance</h3><div class="tbl"><table>
    <thead><tr><th>Fecha</th><th>Global</th><th>Decis.</th><th>Puntos</th><th>Vidas</th><th>Jug.</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
// Copiar / importar / borrar (el historial vive en este navegador: así se pasa de un dispositivo a otro)
$('#hCopy').addEventListener('click',()=>{
  const txt=JSON.stringify(hist);
  const ok=()=>$('#hMsg').textContent=`Historial copiado (${hist.length} partidas). Pegalo en “Importar” en el otro dispositivo.`;
  const fallback=()=>{ $('#impBox').hidden=false; const t=$('#impText'); t.value=txt; t.select(); $('#hMsg').textContent='No pude copiar automáticamente: el texto quedó seleccionado arriba, copialo a mano.'; };
  try{ navigator.clipboard.writeText(txt).then(ok,fallback); }catch(e){ fallback(); }
});
$('#hImp').addEventListener('click',()=>{ $('#impBox').hidden=false; $('#impText').value=''; $('#impText').focus(); });
$('#impCancel').addEventListener('click',()=>{ $('#impBox').hidden=true; });
$('#impGo').addEventListener('click',()=>{
  try{
    const arr=JSON.parse($('#impText').value);
    if(!Array.isArray(arr) || !arr.every(h=>h && h.id && typeof h.global==='number')) throw 0;
    const ids=new Set(hist.map(h=>h.id)); const add=arr.filter(h=>!ids.has(h.id));
    hist=hist.concat(add); saveHist(); $('#impBox').hidden=true;
    $('#hMsg').textContent=`Importadas ${add.length} partidas nuevas${arr.length-add.length?` (${arr.length-add.length} ya estaban)`:''}.`;
  }catch(e){ $('#hMsg').textContent='Ese texto no es un historial válido. Copialo de nuevo con “Copiar historial” en el otro dispositivo.'; }
});
$('#hDel').addEventListener('click',()=>{ $('#delBox').hidden=false; });
$('#delNo').addEventListener('click',()=>{ $('#delBox').hidden=true; });
$('#delYes').addEventListener('click',()=>{ hist=[]; saveHist(); $('#delBox').hidden=true; $('#hMsg').textContent='Historial borrado.'; });

// ---------- Controles ----------
function switchMode(m){
  if(m===mode) return;
  if(mode==='tutor' && game.moves.length>=MIN_MOVES){ const s=summarize(game,score,lines,sets); hist.push(s); saveHist(); log('Guardé la partida del tutor en el historial.'); }
  startGame(m);
}
$('#mEterno').addEventListener('click',()=>switchMode('eterno'));
$('#mTutor').addEventListener('click',()=>switchMode('tutor'));
$('#reset').addEventListener('click',()=>{
  if(mode==='tutor' && game.moves.length>=MIN_MOVES){ finishGame(); return; }   // no perdemos una partida medible
  startGame();
});
$('#finish').addEventListener('click',finishGame);
$('#hints').addEventListener('change',()=>render());
$('#live').addEventListener('change',()=>{ renderTray(); render(); });

buildBoard();
if(loadState()){ syncModeUI(); runAnalysis(); renderTray(); render(); log(mode==='tutor'?`Seguís tu partida del tutor (${game.moves.length} jugadas).`:'Seguís tu partida.'); }
else startGame('eterno');
renderHist();
})();
</script>
